<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px}
        .card{width:100%;max-width:400px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.6);position:relative;overflow:visible}
        .lang{display:flex;justify-content:flex-end;margin-bottom:10px;position:relative}
        .lang-btn{background:rgba(255,255,255,.08);color:#38bdf8;border:1px solid rgba(255,255,255,.15);width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.2s}
        .lang-btn:hover{background:rgba(56,189,248,.2)}
        .lang-menu{display:none;position:absolute;top:45px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:10px;width:140px;max-height:220px;overflow-y:auto;padding:6px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        [dir="rtl"] .lang-menu{left:0}
        [dir="ltr"] .lang-menu{right:0}
        .lang-menu.show{display:block}
        .lang-item{padding:8px 10px;font-size:13px;color:#cbd5e1;cursor:pointer;border-radius:6px;transition:.2s}
        .lang-item:hover{background:rgba(56,189,248,.2);color:#38bdf8}
        .logo{text-align:center;margin-bottom:20px}
        .logo h2{font-size:24px;color:#38bdf8;letter-spacing:2px;font-weight:800}
        .logo p{color:#94a3b8;font-size:12px;margin-top:4px}
        .group{margin-bottom:12px}
        .group label{display:block;margin-bottom:5px;font-size:12px;color:#cbd5e1}
        .req{color:#ef4444}
        .wrap{position:relative;display:flex;align-items:center}
        .wrap i:not(.eye-icon){position:absolute;color:#64748b;font-size:13px}
        [dir="rtl"] .wrap i:not(.eye-icon){right:12px}
        [dir="ltr"] .wrap i:not(.eye-icon){left:12px}
        .eye-btn{position:absolute;background:none;border:none;color:#64748b;cursor:pointer;font-size:13px;padding:4px}
        [dir="rtl"] .eye-btn{left:10px}
        [dir="ltr"] .eye-btn{right:10px}
        input{width:100%;padding:10px 12px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:13px;outline:none}
        [dir="rtl"] input{padding-right:36px;padding-left:36px}
        [dir="ltr"] input{padding-left:36px;padding-right:36px}
        input:focus{border-color:#38bdf8}
        .cap-box{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px;margin-bottom:14px}
        .cap-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
        canvas{width:130px;height:38px;border-radius:6px;background:#0b1120;border:1px solid rgba(255,255,255,.1);cursor:pointer;display:block}
        .ref-btn{background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:6px;color:#38bdf8;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .cap-input{text-align:center;letter-spacing:3px;font-weight:bold;padding-left:12px!important;padding-right:12px!important}
        .btn{width:100%;padding:12px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
        .btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed}
        .footer{text-align:center;margin-top:14px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none}
        #msg{margin-top:8px;font-size:12px;text-align:center;font-weight:bold;padding:6px;border-radius:6px}
        .err{color:#ef4444;background:rgba(239,68,68,.1)}
        .succ{color:#22c55e;background:rgba(34,197,94,.1)}
    </style>
</head>
<body>
    <div class="card">
        <div class="lang">
            <button type="button" class="lang-btn" id="lang-btn"><i class="fas fa-globe"></i></button>
            <div class="lang-menu" id="lang-menu">
                <div class="lang-item" data-lang="fa">فارسی</div>
                <div class="lang-item" data-lang="en">English</div>
                <div class="lang-item" data-lang="ar">العربية</div>
                <div class="lang-item" data-lang="tr">Türkçe</div>
                <div class="lang-item" data-lang="ru">Русский</div>
                <div class="lang-item" data-lang="es">Español</div>
                <div class="lang-item" data-lang="fr">Français</div>
                <div class="lang-item" data-lang="de">Deutsch</div>
            </div>
        </div>
        <div class="logo">
            <h2>ZENIX</h2>
            <p id="t-wel">Register New Account</p>
        </div>
        <form id="form">
            <div class="group">
                <label id="l-email"><i class="fas fa-envelope"></i> Email <span class="req">*</span></label>
                <div class="wrap"><i class="fas fa-at"></i><input type="email" id="email" placeholder="Email" required></div>
            </div>
            <div class="group">
                <label id="l-name"><i class="fas fa-id-card"></i> Full Name <span class="req">*</span></label>
                <div class="wrap"><i class="fas fa-user"></i><input type="text" id="fullname" placeholder="Full Name" required></div>
            </div>
            <div class="group">
                <label id="l-pass"><i class="fas fa-lock"></i> Password <span class="req">*</span></label>
                <div class="wrap"><i class="fas fa-key"></i><input type="password" id="pass" placeholder="Password" required><button type="button" class="eye-btn" onclick="togglePassword('pass',this)"><i class="fas fa-eye eye-icon"></i></button></div>
            </div>
            <div class="group">
                <label id="l-confirm-pass"><i class="fas fa-lock"></i> Confirm Password <span class="req">*</span></label>
                <div class="wrap"><i class="fas fa-key"></i><input type="password" id="confirm-pass" placeholder="Confirm Password" required><button type="button" class="eye-btn" onclick="togglePassword('confirm-pass',this)"><i class="fas fa-eye eye-icon"></i></button></div>
            </div>
            <div class="group">
                <label id="l-ref"><i class="fas fa-ticket"></i> Referral Code <span class="req">*</span></label>
                <div class="wrap"><i class="fas fa-gift"></i><input type="text" id="ref-in" placeholder="Referral Code" required></div>
            </div>
            <div class="group">
                <label id="l-cap"><i class="fas fa-shield-alt"></i> Security Code <span class="req">*</span></label>
                <div class="cap-box">
                    <div class="cap-row">
                        <canvas id="c-canvas" width="130" height="38"></canvas>
                        <button type="button" class="ref-btn" id="ref-btn"><i class="fas fa-sync-alt"></i></button>
                    </div>
                    <input type="text" id="cap-in" class="cap-input" placeholder="Enter code" maxlength="5" required>
                </div>
            </div>
            <button type="submit" id="t-btn" class="btn" disabled>Sign Up</button>
            <div id="msg"></div>
        </form>
        <div class="footer">
            <p><a href="index.html" id="t-back"><i class="fas fa-arrow-left"></i> Back to Main Page</a></p>
        </div>
    </div>
    
    <script>
        function togglePassword(id,btn){
            const input=document.getElementById(id);
            if(input.type==='password'){
                input.type='text';
                btn.innerHTML='<i class="fas fa-eye-slash eye-icon"></i>';
            }else{
                input.type='password';
                btn.innerHTML='<i class="fas fa-eye eye-icon"></i>';
            }
        }
    </script>
    <script type="module">
        import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import{getAuth,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import{getFirestore,doc,setDoc,getDocs,collection,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig={apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"};
        
        const app=initializeApp(firebaseConfig),
              auth=getAuth(app),
              db=getFirestore(app),
              langData={fa:{dir:'rtl',wel:'ثبت‌نام حساب کاربری جدید',email:'ایمیل',emailP:'ایمیل',name:'نام و نام خانوادگی',nameP:'نام و نام خانوادگی',pass:'رمز عبور',passP:'رمز عبور',confirmPass:'تکرار رمز عبور',confirmPassP:'تکرار رمز عبور',ref:'کد معرف',refP:'کد معرف',cap:'کد امنیتی',capP:'کد را وارد کنید',btn:'ثبت‌نام در زنیکس',back:'بازگشت به صفحه اصلی',succ:'ثبت‌نام با موفقیت انجام شد!',err:'کد امنیتی اشتباه است!',refErr:'کد معرف معتبر نیست یا وجود ندارد!',passErr:'رمز عبور و تکرار آن مطابقت ندارند!',lenErr:'رمز عبور باید حداقل ۶ کاراکتر باشد!',existErr:'این ایمیل قبلاً ثبت شده است!'},en:{dir:'ltr',wel:'Register New Account',email:'Email',emailP:'Email',name:'Full Name',nameP:'Full Name',pass:'Password',passP:'Password',confirmPass:'Confirm Password',confirmPassP:'Confirm Password',ref:'Referral Code',refP:'Referral Code',cap:'Security Code',capP:'Enter code',btn:'Sign Up',back:'Back to Main Page',succ:'Successfully registered!',err:'Invalid security code!',refErr:'Invalid or non-existent referral code!',passErr:'Passwords do not match!',lenErr:'Password must be at least 6 characters!',existErr:'Email already registered!'},ar:{dir:'rtl',wel:'تسجيل حساب جديد',email:'البريد الإلكتروني',emailP:'البريد الإلكتروني',name:'الاسم الكامل',nameP:'الاسم الكامل',pass:'كلمة المرور',passP:'كلمة المرور',confirmPass:'تأكيد كلمة المرور',confirmPassP:'تأكيد كلمة المرور',ref:'رمز الإحالة',refP:'رمز الإحالة',cap:'رمز التحقق',capP:'أدخل الرمز',btn:'التسجيل في Zenix',back:'العودة للصفحة الرئيسية',succ:'تم التسجيل بنجاح!',err:'رمز التحقق غير صحيح!',refErr:'رمز الإحالة غير صالح أو غير موجود!',passErr:'كلمتا المرور غير متطابقتين!',lenErr:'يجب أن تكون كلمة المرور 6 أحرف على الأقل!',existErr:'هذا البريد الإلكتروني مسجل بالفعل!'},tr:{dir:'ltr',wel:'Yeni Hesap Oluştur',email:'E-posta',emailP:'E-posta',name:'Ad Soyad',nameP:'Ad Soyad',pass:'Şifre',passP:'Şifre',confirmPass:'Şifreyi Tekrarla',confirmPassP:'Şifreyi Tekrarla',ref:'Referans Kodu',refP:'Referans Kodu',cap:'Güvenlik Kodu',capP:'Kodu girin',btn:'Zenix\'e Kayıt Ol',back:'Ana Sayfaya Dön',succ:'Kayıt başarılı!',err:'Geçersiz güvenlik kodu!',refErr:'Geçersiz veya bulunmayan referans kodu!',passErr:'Şifreler eşleşmiyor!',lenErr:'Şifre en az 6 karakter olmalıdır!',existErr:'Bu e-posta zaten kayıtlı!'},ru:{dir:'ltr',wel:'Регистрация аккаунта',email:'Эл. почта',emailP:'Эл. почта',name:'ФИО',nameP:'Введите ФИО',pass:'Пароль',passP:'Пароль',confirmPass:'Повторите пароль',confirmPassP:'Повторите пароль',ref:'Реферальный код',refP:'Реферальный код',cap:'Защитный код',capP:'Введите код',btn:'Зарегистрироваться',back:'На главную',succ:'Успешная регистрация!',err:'Неверный защитный код!',refErr:'Неверный реферальный код!',passErr:'Пароли не совпадают!',lenErr:'Пароль должен быть не менее 6 символов!',existErr:'Этот email уже зарегистрирован!'},es:{dir:'ltr',wel:'Registrar nueva cuenta',email:'Correo electrónico',emailP:'Correo electrónico',name:'Nombre completo',nameP:'Nombre completo',pass:'Contraseña',passP:'Contraseña',confirmPass:'Confirmar contraseña',confirmPassP:'Confirmar contraseña',ref:'Código de referencia',refP:'Código de referencia',cap:'Código de seguridad',capP:'Ingrese el código',btn:'Registrarse en Zenix',back:'Volver al inicio',succ:'¡Registro exitoso!',err:'¡Código inválido!',refErr:'¡Código de referencia inválido!',passErr:'¡Las contraseñas no coinciden!',lenErr:'¡La contraseña debe tener al menos 6 caracteres!',existErr:'¡Este correo ya está registrado!'},fr:{dir:'ltr',wel:'Créer un compte',email:'E-mail',emailP:'E-mail',name:'Nom complet',nameP:'Nom complet',pass:'Mot de passe',passP:'Mot de passe',confirmPass:'Confirmer',confirmPassP:'Confirmer',ref:'Code de parrainage',refP:'Code',cap:'Code de sécurité',capP:'Entrez le code',btn:'S\'inscrire',back:'Retour',succ:'Inscription réussie !',err:'Code invalide !',refErr:'Code de parrainage invalide !',passErr:'Mots de passe différents !',lenErr:'Le mot de passe doit contenir au moins 6 caractères !',existErr:'E-mail déjà enregistré !'},de:{dir:'ltr',wel:'Konto erstellen',email:'E-Mail',emailP:'E-Mail',name:'Vollständiger Name',nameP:'Vollständiger Name',pass:'Passwort',passP:'Passwort',confirmPass:'Passwort bestätigen',confirmPassP:'Passwort bestätigen',ref:'Empfehlungscode',refP:'Empfehlungscode',cap:'Sicherheitscode',capP:'Code eingeben',btn:'Registrieren',back:'Zurück',succ:'Erfolgreich!',err:'Ungültiger Code!',refErr:'Ungültiger Empfehlungscode!',passErr:'Passwörter stimmen nicht überein!',lenErr:'Das Passwort muss mindestens 6 Zeichen lang sein!',existErr:'E-Mail bereits registriert!'};
        
        let currentLang=localStorage.getItem('zenix_lang')||'en',code='';
        const langBtn=document.getElementById('lang-btn'),langMenu=document.getElementById('lang-menu');
        
        langBtn.onclick=e=>{e.stopPropagation();langMenu.classList.toggle('show')};
        document.onclick=()=>langMenu.classList.remove('show');
        
        function setLang(l){
            currentLang=l;
            localStorage.setItem('zenix_lang',l);
            const t=langData[l];
            document.documentElement.setAttribute('dir',t.dir);
            document.documentElement.setAttribute('lang',l);
            document.getElementById('t-wel').textContent=t.wel;
            document.getElementById('l-email').innerHTML=`<i class="fas fa-envelope"></i> ${t.email} <span class="req">*</span>`;
            document.getElementById('email').placeholder=t.emailP;
            document.getElementById('l-name').innerHTML=`<i class="fas fa-id-card"></i> ${t.name} <span class="req">*</span>`;
            document.getElementById('fullname').placeholder=t.nameP;
            document.getElementById('l-pass').innerHTML=`<i class="fas fa-lock"></i> ${t.pass} <span class="req">*</span>`;
            document.getElementById('pass').placeholder=t.passP;
            document.getElementById('l-confirm-pass').innerHTML=`<i class="fas fa-lock"></i> ${t.confirmPass} <span class="req">*</span>`;
            document.getElementById('confirm-pass').placeholder=t.confirmPassP;
            document.getElementById('l-ref').innerHTML=`<i class="fas fa-ticket"></i> ${t.ref} <span class="req">*</span>`;
            document.getElementById('ref-in').placeholder=t.refP;
            document.getElementById('l-cap').innerHTML=`<i class="fas fa-shield-alt"></i> ${t.cap} <span class="req">*</span>`;
            document.getElementById('cap-in').placeholder=t.capP;
            document.getElementById('t-btn').textContent=t.btn;
            const arrowIcon=t.dir==='rtl'?'fa-arrow-right':'fa-arrow-left';
            document.getElementById('t-back').innerHTML=`<i class="fas ${arrowIcon}"></i> ${t.back}`;
        }
        
        document.querySelectorAll('.lang-item').forEach(i=>i.onclick=()=>setLang(i.dataset.lang));
        
        const cv=document.getElementById('c-canvas'),ctx=cv.getContext('2d'),
              emailIn=document.getElementById('email'),nameIn=document.getElementById('fullname'),
              passIn=document.getElementById('pass'),confirmPassIn=document.getElementById('confirm-pass'),
              refIn=document.getElementById('ref-in'),capIn=document.getElementById('cap-in'),
              btn=document.getElementById('t-btn'),msg=document.getElementById('msg'),form=document.getElementById('form'),
              urlParams=new URLSearchParams(window.location.search),refParam=urlParams.get('ref');
              
        if(refParam){
            refIn.value=refParam;
            refIn.readOnly=true;
            refIn.style.background='rgba(10,15,30,.4)';
            refIn.style.cursor='not-allowed';
        }
        
        function chk(){
            btn.disabled=!(emailIn.value.trim()&&nameIn.value.trim()&&passIn.value.trim()&&confirmPassIn.value.trim()&&refIn.value.trim()&&capIn.value.length===5);
        }
        
        [emailIn,nameIn,passIn,confirmPassIn,refIn,capIn].forEach(i=>i.oninput=chk);
        
        function drawCap(){
            code='';
            const chars='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
            for(let i=0;i<5;i++)code+=chars[Math.floor(Math.random()*chars.length)];
            ctx.fillStyle='#0b1120';
            ctx.fillRect(0,0,cv.width,cv.height);
            ctx.font='bold 18px Arial';
            ctx.fillStyle='#38bdf8';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            for(let i=0;i<5;i++){
                ctx.fillText(code[i],14+(i*24),cv.height/2);
            }
        }
        
        document.getElementById('ref-btn').onclick=()=>{capIn.value='';drawCap();chk();};
        cv.onclick=()=>{drawCap();chk();};
        
        form.onsubmit=async(e)=>{
            e.preventDefault();
            const t=langData[currentLang];
            if(passIn.value.length<6){msg.textContent=t.lenErr;msg.className='err';return;}
            if(passIn.value!==confirmPassIn.value){msg.textContent=t.passErr;msg.className='err';return;}
            if(capIn.value.toUpperCase()!==code){msg.textContent=t.err;msg.className='err';capIn.value='';drawCap();chk();return;}
            
            btn.disabled=true;
            const emailValue=emailIn.value.trim().toLowerCase(),
                  fullNameValue=nameIn.value.trim(),
                  refCodeValue=refIn.value.trim().toUpperCase();
                  
            try{
                const refQuery=query(collection(db,"users"),where("referralCode","==",refCodeValue));
                const refSnap=await getDocs(refQuery);
                if(refSnap.empty){
                    btn.disabled=false;
                    msg.textContent=t.refErr;
                    msg.className='err';
                    capIn.value='';
                    drawCap();
                    chk();
                    return;
                }
                const userCredential=await createUserWithEmailAndPassword(auth,emailValue,passIn.value),
                      user=userCredential.user,
                      userOwnRefCode=Math.random().toString(36).substring(2,8).toUpperCase();
                      
                await setDoc(doc(db,"users",user.uid),{
                    uid:user.uid,
                    fullname:fullNameValue,
                    email:emailValue,
                    referredBy:refCodeValue,
                    referralCode:userOwnRefCode,
                    balance:0,
                    createdAt:serverTimestamp(),
                    lastLogin:serverTimestamp()
                });
                
                msg.textContent=t.succ;
                msg.className='succ';
                setTimeout(()=>window.location.href='index.html',1500);
            }catch(error){
                btn.disabled=false;
                if(error.code==='auth/email-already-in-use'){
                    msg.textContent=t.existErr;
                }else{
                    msg.textContent=error.message;
                }
                msg.className='err';
                capIn.value='';
                drawCap();
                chk();
            }
        };
        
        setLang(currentLang);
        drawCap();
        chk();
    </script>
</body>
</html>
