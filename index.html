<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix - Login</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,Tahoma,sans-serif;background-color:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px;position:relative;overflow-x:hidden}.glow-1,.glow-2{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none}.glow-1{width:250px;height:250px;background:#0ea5e9;top:10%;left:10%}.glow-2{width:250px;height:250px;background:#a855f7;bottom:10%;right:10%}.auth-card{width:100%;max-width:400px;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative;z-index:10}.lang-box{position:relative;display:flex;justify-content:flex-end;margin-bottom:12px}.lang-btn{background:rgba(255,255,255,.08);color:#38bdf8;border:1px solid rgba(255,255,255,.15);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s}.lang-btn:hover{background:rgba(56,189,248,.2)}.lang-menu{display:none;position:absolute;top:45px;z-index:9999;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:12px;width:150px;max-height:220px;overflow-y:auto;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.8)}html[dir="rtl"] .lang-menu{left:0}html[dir="ltr"] .lang-menu{right:0}.lang-menu.show{display:block!important}.lang-item{padding:8px 10px;font-size:13px;color:#cbd5e1;cursor:pointer;border-radius:6px;transition:.2s}.lang-item:hover{background:rgba(56,189,248,.2);color:#38bdf8}.logo{text-align:center;margin-bottom:22px}.logo-icon{width:56px;height:56px;margin:0 auto 10px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#38bdf8}.logo h2{font-size:26px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo p{color:#94a3b8;font-size:12px;margin-top:4px}.group{margin-bottom:14px}.group label{display:block;margin-bottom:6px;font-size:12px;color:#cbd5e1}.req{color:#ef4444;font-weight:700;margin-inline-start:3px}.wrap{position:relative;display:flex;align-items:center}.wrap i.f-icon{position:absolute;color:#64748b;font-size:14px;z-index:2}html[dir="rtl"] .wrap i.f-icon{right:14px}html[dir="ltr"] .wrap i.f-icon{left:14px}.eye-btn{position:absolute;background:none;border:none;color:#64748b;cursor:pointer;font-size:14px;padding:4px;z-index:2}html[dir="rtl"] .eye-btn{left:12px}html[dir="ltr"] .eye-btn{right:12px}.group input{width:100%;padding:12px 14px;background:rgba(10,15,30,.7)!important;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff!important;font-size:13px;outline:0;-webkit-text-fill-color:#fff!important;transition:background-color 5000s ease-in-out 0s}html[dir="rtl"] .group input{padding-right:40px;padding-left:40px}html[dir="ltr"] .group input{padding-left:40px;padding-right:40px}/* رفع مشکل سفید شدن پس‌زمینه هنگام اتوفیل مرورگر */
.group input:-webkit-autofill,
.group input:-webkit-autofill:hover,
.group input:-webkit-autofill:focus,
.group input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0 30px rgba(10,15,30,0.95) inset !important;
    -webkit-text-fill-color: #fff !important;
    caret-color: #fff;
}.group input:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.2)}.cap-box{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;margin-bottom:16px}.cap-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}#c-canvas{border-radius:8px;background:#0b1120;border:1px solid rgba(255,255,255,.1);cursor:pointer}.ref-btn{background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:8px;color:#38bdf8;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}.cap-input{text-align:center;letter-spacing:4px;font-weight:700;padding:8px!important}.extra-links{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px}.extra-links a{color:#38bdf8;text-decoration:none}.extra-links a:hover{text-decoration:underline}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s ease}.btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed;box-shadow:none}.footer{text-align:center;margin-top:16px;font-size:12px;color:#94a3b8}.footer a{color:#38bdf8;text-decoration:none;font-weight:700}#msg{margin-top:10px;font-size:12px;text-align:center;font-weight:700;padding:8px;border-radius:8px}.err{color:#ef4444;background:rgba(239,68,68,.1)}.succ{color:#22c55e;background:rgba(34,197,94,.1)}</style></head><body><div class="glow-1"></div><div class="glow-2"></div><div class="auth-card"><div class="lang-box"><button type="button" class="lang-btn" id="lang-btn"><i class="fas fa-globe"></i></button><div class="lang-menu" id="lang-menu"><div class="lang-item" data-lang="fa">فارسی</div><div class="lang-item" data-lang="en">English</div><div class="lang-item" data-lang="ar">العربية</div><div class="lang-item" data-lang="tr">Türkçe</div><div class="lang-item" data-lang="ru">Русский</div><div class="lang-item" data-lang="es">Español</div><div class="lang-item" data-lang="fr">Français</div><div class="lang-item" data-lang="de">Deutsch</div></div></div><div class="logo"><div class="logo-icon"><svg width="34" height="34" viewBox="0 0 100 100" fill="none"><path d="M 20 25 L 80 25 C 85 25 88 28 85 33 L 35 70 L 80 70 C 85 70 85 75 80 75 L 20 75 C 15 75 12 72 15 67 L 65 30 L 20 30 C 15 30 15 25 20 25 Z" fill="url(#zenixGrad)"/><defs><linearGradient id="zenixGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs><circle cx="78" cy="27.5" r="4" fill="#38bdf8"/></svg></div><h2>ZENIX</h2><p id="t-wel">Login to Your Account</p></div><form id="form"><div class="group"><label id="l-user"><i class="fas fa-user"></i> Email <span class="req">*</span></label><div class="wrap"><i class="fas fa-envelope f-icon"></i><input type="email" id="user" placeholder="Email Address" autocomplete="email" required></div></div><div class="group"><label id="l-pass"><i class="fas fa-lock"></i> Password <span class="req">*</span></label><div class="wrap"><i class="fas fa-key f-icon"></i><input type="password" id="pass" placeholder="Password" autocomplete="current-password" required><button type="button" class="eye-btn" onclick="togglePassword('pass',this)"><i class="fas fa-eye"></i></button></div></div><div class="group"><label id="l-cap"><i class="fas fa-shield-alt"></i> Security Code <span class="req">*</span></label><div class="cap-box"><div class="cap-row"><canvas id="c-canvas" width="140" height="38"></canvas><button type="button" class="ref-btn" id="ref-btn"><i class="fas fa-sync-alt"></i></button></div><input type="text" id="cap-in" class="cap-input" placeholder="Enter code" maxlength="5" autocomplete="off" required></div></div><div class="extra-links"><a href="forgot-password.html" id="t-forgot">Forgot password?</a></div><button type="submit" id="t-btn" class="btn" disabled>Login</button><div id="msg"></div></form><div class="footer"><p id="t-foot">Don't have an account? <a href="register.html">Register</a></p></div></div><script>function togglePassword(id,btn){const input=document.getElementById(id);if(input.type==='password'){input.type='text';btn.innerHTML='<i class="fas fa-eye-slash"></i>';}else{input.type='password';btn.innerHTML='<i class="fas fa-eye"></i>';}}</script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"}),auth=getAuth(app),db=getFirestore(app),langData={fa:{dir:'rtl',wel:'ورود به حساب کاربری',user:'ایمیل',userP:'آدرس ایمیل',pass:'رمز عبور',passP:'رمز عبور',cap:'کد امنیتی',capP:'کد را وارد کنید',forgot:'فراموشی رمز عبور؟',btn:'ورود به حساب',noAcc:'حساب کاربری ندارید؟',reg:'ثبت‌نام کنید',errCap:'کد امنیتی اشتباه است!',errNoUser:'حساب کاربری یافت نشد یا رمز عبور اشتباه است!',errNet:'لطفاً اتصال اینترنت خود را بررسی کنید!',succ:'با موفقیت وارد شدید! در حال انتقال...'},en:{dir:'ltr',wel:'Login to Your Account',user:'Email',userP:'Email Address',pass:'Password',passP:'Password',cap:'Security Code',capP:'Enter code',forgot:'Forgot password?',btn:'Login',noAcc:"Don't have an account?",reg:'Register',errCap:'Invalid security code!',errNoUser:'Invalid credentials or account does not exist!',errNet:'Please check your internet connection!',succ:'Successfully logged in! Redirecting...'},ar:{dir:'rtl',wel:'تسجيل الدخول إلى حسابك',user:'البريد الإلكتروني',userP:'عنوان البريد الإلكتروني',pass:'كلمة المرور',passP:'كلمة المرور',cap:'رمز التحقق',capP:'أدخل الرمز',forgot:'نسيت كلمة المرور؟',btn:'تسجيل الدخول',noAcc:'ليس لديك حساب؟',reg:'سجل الآن',errCap:'رمز التحقق غير صحيح!',errNoUser:'بيانات الدخول غير صحيحة!',errNet:'يرجى التحقق من اتصالك بالإنترنت!',succ:'تم تسجيل الدخول بنجاح! جاري التوجيه...'},tr:{dir:'ltr',wel:'Hesabınıza Giriş Yapın',user:'E-posta',userP:'E-posta Adresi',pass:'Şifre',passP:'Şifre',cap:'Güvenlik Kodu',capP:'Kodu girin',forgot:'Şifrenizi mi unuttunuz?',btn:'Giriş Yap',noAcc:'Hesabınız yok mu?',reg:'Kayıt Olın',errCap:'Geçersiz güvenlik kodu!',errNoUser:'Hatalı e-posta veya şifre!',errNet:'Lütfen internet bağlantınızı kontrol edin!',succ:'Giriş başarılı! Yönlendiriliyorsunuz...'},ru:{dir:'ltr',wel:'Вход в аккаунт',user:'Email',userP:'Адрес Email',pass:'Пароль',passP:'Пароль',cap:'Защитный код',capP:'Введите код',forgot:'Забыли пароль?',btn:'Войти',noAcc:'Нет аккаунта?',reg:'Зарегистрироваться',errCap:'Неверный защитный код!',errNoUser:'Неверные данные для входа!',errNet:'Пожалуйста, проверьте интернет-соединение!',succ:'Успешный вход! Перенаправление...'},es:{dir:'ltr',wel:'Iniciar sesión en su cuenta',user:'Correo electrónico',userP:'Dirección de correo',pass:'Contraseña',passP:'Contraseña',cap:'Código de seguridad',capP:'Ingrese el código',forgot:'¿Olvidaste tu contraseña?',btn:'Iniciar sesión',noAcc:'¿No tienes una cuenta?',reg:'Regístrate',errCap:'¡Código de seguridad inválido!',errNoUser:'¡Credenciales inválidas!',errNet:'¡Por favor verifique su conexión a internet!',succ:'¡Inicio de sesión exitoso! Redirigiendo...'},fr:{dir:'ltr',wel:'Connexion à votre compte',user:'E-mail',userP:'Adresse e-mail',pass:'Mot de passe',passP:'Mot de passe',cap:'Code de sécurité',capP:'Entrez le code',forgot:'Mot de passe oublié ?',btn:'Se connecter',noAcc:'Vous n\'avez pas de compte ?',reg:'Inscrivez-vous',errCap:'Code de sécurité invalide !',errNoUser:'Identifiants invalides !',errNet:'Veuillez vérifier votre connexion Internet !',succ:'Connexion réussie ! Redirection...'},de:{dir:'ltr',wel:'Anmeldung bei Ihrem Konto',user:'E-Mail',userP:'E-Mail-Adresse',pass:'Passwort',passP:'Passwort',cap:'Sicherheitscode',capP:'Code eingeben',forgot:'Passwort vergessen?',btn:'Anmelden',noAcc:'Noch kein Konto?',reg:'Registrieren',errCap:'Ungültiger Sicherheitscode!',errNoUser:'Ungültige Anmeldedaten!',errNet:'Bitte überprüfen Sie Ihre Internetverbindung!',succ:'Erfolgreich angemeldet! Weiterleitung...'}};let currentLang=localStorage.getItem('zenix_lang')||'en',code='';const langBtn=document.getElementById('lang-btn'),langMenu=document.getElementById('lang-menu'),cv=document.getElementById('c-canvas'),capIn=document.getElementById('cap-in'),userIn=document.getElementById('user'),passIn=document.getElementById('pass'),submitBtn=document.getElementById('t-btn'),msg=document.getElementById('msg'),form=document.getElementById('form');langBtn.addEventListener('click',e=>{e.stopPropagation();langMenu.classList.toggle('show')});document.addEventListener('click',()=>langMenu.classList.remove('show'));function setLang(l){currentLang=l;localStorage.setItem('zenix_lang',l);const t=langData[l];document.documentElement.setAttribute('dir',t.dir);document.documentElement.setAttribute('lang',l);document.getElementById('t-wel').textContent=t.wel;document.getElementById('l-user').innerHTML=`<i class="fas fa-envelope"></i> ${t.user} <span class="req">*</span>`;userIn.placeholder=t.userP;document.getElementById('l-pass').innerHTML=`<i class="fas fa-lock"></i> ${t.pass} <span class="req">*</span>`;passIn.placeholder=t.passP;document.getElementById('l-cap').innerHTML=`<i class="fas fa-shield-alt"></i> ${t.cap} <span class="req">*</span>`;capIn.placeholder=t.capP;document.getElementById('t-forgot').textContent=t.forgot;submitBtn.textContent=t.btn;document.getElementById('t-foot').innerHTML=`${t.noAcc} <a href="register.html">${t.reg}</a>`}document.querySelectorAll('.lang-item').forEach(i=>i.addEventListener('click',()=>setLang(i.dataset.lang)));function checkInputs(){submitBtn.disabled=!(userIn.value.trim()&&passIn.value.trim()&&capIn.value.length===5)}[userIn,passIn,capIn].forEach(i=>i.addEventListener('input',checkInputs));window.addEventListener('DOMContentLoaded',()=>{setTimeout(checkInputs, 200);});function drawCap(){if(!cv)return;const ctx=cv.getContext('2d');code='';const chars='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';for(let i=0;i<5;i++)code+=chars.charAt(Math.floor(Math.random()*chars.length));ctx.fillStyle='#0b1120';ctx.fillRect(0,0,cv.width,cv.height);ctx.font='bold 19px Arial';ctx.fillStyle='#38bdf8';ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<5;i++)ctx.fillText(code[i],20+(i*25),cv.height/2)}function resetFormWithError(k){const t=langData[currentLang];msg.textContent=t[k]||k;msg.className='err';capIn.value='';drawCap();checkInputs()}document.getElementById('ref-btn').addEventListener('click',()=>{capIn.value='';drawCap();checkInputs()});cv.addEventListener('click',()=>{drawCap();checkInputs()});form.addEventListener('submit',async(e)=>{e.preventDefault();const email=userIn.value.trim(),password=passIn.value.trim();if(capIn.value.toUpperCase()!==code)return resetFormWithError('errCap');submitBtn.disabled=true;try{const userCredential=await signInWithEmailAndPassword(auth,email,password),user=userCredential.user;await setDoc(doc(db,"users",user.uid),{uid:user.uid,email:user.email,lastLogin:serverTimestamp()},{merge:true});msg.textContent=langData[currentLang].succ;msg.className='succ';setTimeout(()=>{window.location.href='dashboard.html'},1000)}catch(error){console.error(error);if(!navigator.onLine || error.code==='auth/network-request-failed'||error.message.includes('network')||error.code==='auth/internal-error'){resetFormWithError('errNet');}else{resetFormWithError('errNoUser');}checkInputs();}});window.addEventListener('pageshow',()=>{msg.textContent='';msg.className='';drawCap();checkInputs();});setLang(currentLang);drawCap();</script></body></html>
