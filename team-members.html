import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

const L={
fa:{dir:'rtl',adminMsg:'پیام مدیریت',welcomeText:'به پلتفرم زنیکس خوش آمدید.',home:'صفحه اصلی',quantification:'کوانتیفیکیشن',deposit:'واریز',receive:'برداشت',team:'تیم من',transactions:'تراکنش',profile:'پروفایل',support:'پشتیبانی',logout:'خروج',tTpl:'اعضای نسل',desc:'مشاهده جزئیات و مبالغ واریز و برداشت کاربران',reg:'ثبت‌نام:',dep:'آخرین واریز:',nf:'کاربری در این نسل یافت نشد.'},
en:{dir:'ltr',adminMsg:'Admin Message',welcomeText:'Welcome to Zenix platform.',home:'Home',quantification:'Quantification',deposit:'Deposit',receive:'Withdraw',team:'My Team',transactions:'Transactions',profile:'Profile',support:'Support',logout:'Logout',tTpl:'Generation Members',desc:'View user deposit and withdrawal details and amounts',reg:'Register:',dep:'Last Deposit:',nf:'No users found in this generation.'},
ar:{dir:'rtl',adminMsg:'رسالة المشرف',welcomeText:'مرحبًا بك في منصة زينيكس.',home:'الرئيسية',quantification:'التحديد الكمي',deposit:'إيداع',receive:'سحب',team:'فريقنا',transactions:'المعاملات',profile:'الملف الشخصي',support:'الدعم',logout:'تسجيل الخروج',tTpl:'أعضاء الجيل',desc:'عرض تفاصيل ومبالغ الإيداع والسحب للمستخدمين',reg:'التسجيل:',dep:'آخر إيداع:',nf:'لم يتم العثور على مستخدمين في هذا الجيل.'},

fr:{dir:'ltr',adminMsg:'Message Admin',welcomeText:'Bienvenue sur la plateforme Zenix.',home:'Accueil',quantification:'Quantification',deposit:'Dépôt',receive:'Retrait',team:'Mon équipe',transactions:'Transactions',profile:'Profil',support:'Support',logout:'Déconnexion',tTpl:'Membres de la génération',desc:'Afficher les détails et montants des dépôts et retraits',reg:'Inscription:',dep:'Dernier dépôt:',nf:'Aucun utilisateur trouvé dans cette génération.'},
de:{dir:'ltr',adminMsg:'Admin-Nachricht',welcomeText:'Willkommen auf der Zenix-Plattform.',home:'Startseite',quantification:'Quantifizierung',deposit:'Einzahlung',receive:'Auszahlung',team:'Mein Team',transactions:'Transaktionen',profile:'Profil',support:'Support',logout:'Abmelden',tTpl:'Generationsmitglieder',desc:'Details und Beträge von Ein- und Auszahlungen anzeigen',reg:'Registrierung:',dep:'Letzte Einzahlung:',nf:'Keine Benutzer in dieser Generation gefunden.'},
es:{dir:'ltr',adminMsg:'Mensaje de Admin',welcomeText:'Bienvenido a la plataforma Zenix.',home:'Inicio',quantification:'Cuantificación',deposit:'Depósito',receive:'Retiro',team:'Mi equipo',transactions:'Transactions',profile:'Perfil',support:'Soporte',logout:'Cerrar sesión',tTpl:'Miembros de la generación',desc:'Ver detalles y montos de depósitos y retiros de usuarios',reg:'Registro:',dep:'Último depósito:',nf:'No se encontraron usuarios en esta generación.'},
ru:{dir:'ltr',adminMsg:'Сообщение админа',welcomeText:'Добро пожаловать на платформу Zenix.',home:'Главная',quantification:'Квантификация',deposit:'Депозит',receive:'Вывод',team:'Моя команда',transactions:'Транзакции',profile:'Профиль',support:'Поддержка',logout:'Выйти',tTpl:'Участники поколения',desc:'Просмотр деталей и сумм депозитов и выводов',reg:'Регистрация:',dep:'Последний депозит:',nf:'В этом поколении пользователей не найдено.'}
};

const p=new URLSearchParams(location.search),lvl=p.get('level')||'1';
const fmt=v=>(v%1===0?v:Number(v).toFixed(2))+'&nbsp;&nbsp;&nbsp;$';

window.setLang=function(lang){
    const t=L[lang]||L.fa;
    document.documentElement.dir=t.dir;
    document.documentElement.lang=lang;
    localStorage.setItem('zenix_lang',lang);
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k=el.getAttribute('data-i18n');
        if(t[k])el.innerText=t[k];
    });
    document.getElementById('page-title').innerText=`${t.tTpl} ${lvl}`;
    document.getElementById('page-desc').innerText=t.desc;
    if(window.currentMembers){
        renderList(window.currentMembers, t);
    }
}

function renderList(lst, t){
    document.getElementById('team-members-list').innerHTML=lst.length?lst.map(m=>`
    <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);padding:16px;border-radius:8px;font-size:15px;">
    <div>
    <div style="color:#f8fafc;font-weight:bold;font-size:17px;margin-bottom:4px;">${m.n}</div>
    <div style="font-size:13px;color:#94a3b8;"><i class="fas fa-user-plus"></i> ${t.reg} ${m.regDate}</div>
    <div style="font-size:13px;color:#38bdf8;margin-top:4px;"><i class="fas fa-arrow-down-right"></i> ${t.dep} ${m.depDate}</div>
    </div>
    <div style="display:grid;grid-template-columns:auto auto;gap:4px 12px;align-items:center;text-align:left;">
    <span style="font-size:13px;color:#94a3b8;text-align:right;">${t.deposit}:</span>
    <span style="color:#22c55e;font-weight:bold;font-size:15px;direction:ltr;display:inline-block;">${fmt(m.v)}</span>
    <span style="font-size:13px;color:#94a3b8;text-align:right;">${t.receive}:</span>
    <span style="color:#ef4444;font-weight:bold;font-size:15px;direction:ltr;display:inline-block;">${fmt(m.w)}</span>
    </div>
    </div>`).join(''):`<div style="text-align:center;color:#94a3b8;padding:20px;font-size:15px;">${t.nf}</div>`;
}

onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href="login.html";return;}
    try{
        const userSnap=await getDoc(doc(db,"users",user.uid));
        if(userSnap.exists()){
            const refCode=userSnap.data().referralCode;
            let memberList=[];
            if(refCode){
                const usersRef=collection(db,"users");
                const q1=query(usersRef,where("referredBy","==",refCode));
                const s1=await getDocs(q1);
                let codes1=[];
                s1.forEach(d=>{
                    const u=d.data();
                    if(lvl==='1') memberList.push({n:u.username||u.email||'کاربر',regDate:u.createdAt||'---',v:u.totalDeposit||0,w:u.totalWithdraw||0,depDate:u.lastDepositDate||'---'});
                    if(u.referralCode) codes1.push(u.referralCode);
                });

                if(lvl==='2' && codes1.length>0){
                    const q2=query(usersRef,where("referredBy","in",codes1.slice(0,10)));
                    const s2=await getDocs(q2);
                    s2.forEach(d=>{
                        const u=d.data();
                        memberList.push({n:u.username||u.email||'کاربر',regDate:u.createdAt||'---',v:u.totalDeposit||0,w:u.totalWithdraw||0,depDate:u.lastDepositDate||'---'});
                    });
                }else if(lvl==='3' && codes1.length>0){
                    const q2=query(usersRef,where("referredBy","in",codes1.slice(0,10)));
                    const s2=await getDocs(q2);
                    let codes2=[];
                    s2.forEach(d=>{if(d.data().referralCode)codes2.push(d.data().referralCode);});
                    if(codes2.length>0){
                        const q3=query(usersRef,where("referredBy","in",codes2.slice(0,10)));
                        const s3=await getDocs(q3);
                        s3.forEach(d=>{
                            const u=d.data();
                            memberList.push({n:u.username||u.email||'کاربر',regDate:u.createdAt||'---',v:u.totalDeposit||0,w:u.totalWithdraw||0,depDate:u.lastDepositDate||'---'});
                        });
                    }
                }
            }
            window.currentMembers=memberList;
            const lang=localStorage.getItem('zenix_lang')||'fa';
            setLang(lang);
        }
    }catch(err){console.error(err);}
});

document.querySelectorAll('#lang-menu .mi').forEach(el=>{
    el.onclick=()=>setLang(el.getAttribute('data-lang'));
});
</script></body></html>
