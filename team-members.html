ge-desc" style="font-size:15px"></p></div></div><div style="background:rgba(30,41,59,0.8);border:1px solid rgba(56,189,248,0.3);border-radius:12px;padding:16px;margin-top:12px"><div id="team-members-list" class="team-container"></div></div></div><footer><p>&copy; 2026 Zenix</p></footer><script src="script.js"></script><script type="module">

const firebaseConfig={apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"};

const L={
fa:{dir:'rtl',adminMsg:'پیام مدیریت',welcomeText:'به پلتفرم زنیکس خوش آمدید.',home:'صفحه اصلی',quantification:'کوانتیفیکیشن',deposit:'واریز',receive:'برداشت',team:'تیم من',transactions:'تراکنش',profile:'پروفایل',support:'پشتیبانی',logout:'خروج',tTpl:'اعضای نسل',desc:'مشاهده جزئیات، مبالغ و تاریخ فعالیت کاربران زیرمجموعه',reg:'ثبت‌نام:',dep:'آخرین واریز:',nf:'کاربری در این نسل یافت نشد.',depositLbl:'واریز:',receiveLbl:'برداشت:'},

};

const p=new URLSearchParams(location.search),lvl=p.get('level')||'1';
const fmt=v=>(v%1===0?v:Number(v).toFixed(2))+' $';

function formatDate(val){
    if(!val) return '---';
    if(val.seconds){
        const date=new Date(val.seconds*1000);
        return date.toISOString().replace('T',' ').substring(0,16);
    }
    return val;
}

window.setLang=function(lang){
    const t=L[lang]||L.fa;
    document.documentElement.dir=t.dir;
    document.documentElement.lang=lang;
    localStorage.setItem('zenix_lang',lang);
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k=el.getAttribute('data-i18n');
        if(t[k])el.innerText=t[k];
    });
    document.getElementById('page-title').innerText=`${t.tTpl} ${lvl}`;
    document.getElementById('page-desc').innerText=t.desc;
    if(window.currentMembers){
        renderList(window.currentMembers, t);
    }
}

function renderList(lst, t){
    document.getElementById('team-members-list').innerHTML=lst.length?lst.map(m=>`
    <div class="member-card">
        <div class="member-top">
            <div style="display:flex;flex-direction:column;gap:3px;">
                <div style="color:#38bdf8;font-weight:bold;font-size:16px;display:flex;align-items:center;gap:6px;"><i class="fas fa-user-circle"></i> ${m.n}</div>
                <div style="font-size:12px;color:#94a3b8;direction:ltr;text-align:right;">ID: ${m.id}</div>
            </div>
            <div style="background:rgba(56,189,248,0.1);color:#38bdf8;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:bold;">نسل ${lvl}</div>
        </div>
        <div class="member-stats">
            <div class="stat-box">
                <span style="font-size:13px;color:#94a3b8;">${t.depositLbl}</span>
                <span style="color:#22c55e;font-weight:bold;font-size:15px;direction:ltr;">${fmt(m.v)}</span>
            </div>
            <div class="stat-box">
                <span style="font-size:13px;color:#94a3b8;">${t.receiveLbl}</span>
                <span style="color:#ef4444;font-weight:bold;font-size:15px;direction:ltr;">${fmt(m.w)}</span>
            </div>
        </div>
        <div class="member-dates">
            <div><i class="fas fa-user-plus" style="margin-left:4px;color:#38bdf8;"></i> ${t.reg} <span style="color:#f8fafc;direction:ltr;display:inline-block;">${m.regDate}</span></div>
            <div><i class="fas fa-clock" style="margin-left:4px;color:#eab308;"></i> ${t.dep} <span style="color:#f8fafc;direction:ltr;display:inline-block;">${m.depDate}</span></div>
        </div>
    </div>`).join(''):`<div style="text-align:center;color:#94a3b8;padding:25px;font-size:15px;"><i class="fas fa-info-circle"></i> ${t.nf}</div>`;
}

onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href="login.html";return;}
    try{
        const userSnap=await getDoc(doc(db,"users",user.uid));
        if(userSnap.exists()){
            const refCode=userSnap.data().referralCode;
            let memberList=[];
            if(refCode){
                const usersRef=collection(db,"users");
                const q1=query(usersRef,where("referredBy","==",refCode));
                const s1=await getDocs(q1);
                let codes1=[];
                s1.forEach(d=>{
                    const u=d.data();
                    if(lvl==='1'){
                        memberList.push({
                            id:u.referralCode||'---',
                            n:u.username||u.email?.split('@')[0]||'کاربر',
                            regDate:formatDate(u.createdAt),
                            v:u.totalDeposit||0,
                            w:u.totalWithdraw||0,
                            depDate:formatDate(u.lastDepositDate)
                        });
                    }
                    if(u.referralCode) codes1.push(u.referralCode);
                });

                if(lvl==='2' && codes1.length>0){
                    const q2=query(usersRef,where("referredBy","in",codes1.slice(0,10)));
                    const s2=await getDocs(q2);
                    s2.forEach(d=>{
                        const u=d.data();
                        memberList.push({
                            id:u.referralCode||'---',
                            n:u.username||u.email?.split('@')[0]||'کاربر',
                            regDate:formatDate(u.createdAt),
                            v:u.totalDeposit||0,
                            w:u.totalWithdraw||0,
                            depDate:formatDate(u.lastDepositDate)
                        });
                    });
                }else if(lvl==='3' && codes1.length>0){
                    const q2=query(usersRef,where("referredBy","in",codes1.slice(0,10)));
                    const s2=await getDocs(q2);
                    let codes2=[];
                    s2.forEach(d=>{if(d.data().referralCode)codes2.push(d.data().referralCode);});
                    if(codes2.length>0){
                        const q3=query(usersRef,where("referredBy","in",codes2.slice(0,10)));
                        const s3=await getDocs(q3);
                        s3.forEach(d=>{
                            const u=d.data();
                            memberList.push({
                                id:u.referralCode||'---',
                                n:u.username||u.email?.split('@')[0]||'کاربر',
                                regDate:formatDate(u.createdAt),
                                v:u.totalDeposit||0,
                                w:u.totalWithdraw||0,
                                depDate:formatDate(u.lastDepositDate)
                            });
                        });
                    }
                }
            }
            window.currentMembers=memberList;
            const lang=localStorage.getItem('zenix_lang')||'fa';
            setLang(lang);
        }
    }catch(err){console.error(err);}
});

document.querySelectorAll('#lang-menu .mi').forEach(el=>{
    el.onclick=()=>setLang(el.getAttribute('data-lang'));
});
</script></body></html>
