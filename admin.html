<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix - مدیریت</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}header{background:rgba(15,23,42,.95);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.logo h2{font-size:16px;color:#38bdf8;font-weight:800}.btn-logout{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}.c{max-width:1200px;width:100%;margin:15px auto;padding:0 12px;flex:1}.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}.search-box{position:relative;flex:1;max-width:300px}.search-box input{width:100%;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 12px 8px 32px;color:#fff;font-size:12px;outline:none}.search-box input:focus{border-color:#38bdf8}.search-box i{position:absolute;top:10px;left:10px;color:#94a3b8;font-size:12px}.panel-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;overflow:hidden}.table-responsive{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:right;font-size:11px}th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}th{color:#94a3b8;font-weight:600;background:rgba(255,255,255,.02)}td{color:#cbd5e1}.badge{background:rgba(34,197,94,.15);color:#22c55e;padding:2px 6px;border-radius:4px;font-weight:600}.btn-edit{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center}.modal.show{display:flex}.modal-content{background:#0f172a;border:1px solid rgba(56,189,248,.3);border-radius:12px;width:100%;max-width:420px;padding:18px;max-height:90vh;overflow-y:auto}.form-group{margin-bottom:10px}.form-group label{display:block;font-size:10px;color:#94a3b8;margin-bottom:3px}.form-group input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 10px;color:#fff;font-size:12px;outline:none}.form-group input:focus{border-color:#38bdf8}.btn-save{width:100%;background:#0284c7;color:#fff;border:none;padding:9px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:12px}footer{text-align:center;padding:10px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.05)}</style></head><body>
<header><div class="logo"><h2>ZENIX ADMIN</h2></div><button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button></header>
<div class="c">
<div class="top-bar">
<div style="font-size:14px;color:#38bdf8;font-weight:700"><i class="fas fa-users"></i> لیست کاربران</div>
<div class="search-box"><input type="text" id="search-input" placeholder="جستجو بر اساس ID پلتفرم (مثل MS-...)، نام یا ایمیل..."><i class="fas fa-search"></i></div>
</div>
<div class="panel-box">
<div class="table-responsive">
<table>
<thead>
<tr>
<th>ID پلتفرم</th>
<th>نام کاربر</th>
<th>ایمیل / موبایل</th>
<th>موجودی</th>
<th>واریزی</th>
<th>پاداش</th>
<th>رمز عبور</th>
<th>رمز تراکنش</th>
<th>عملیات</th>
</tr>
</thead>
<tbody id="users-table-body">
<tr><td colspan="9" style="text-align:center;color:#94a3b8;">در حال بارگذاری...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
<div class="modal" id="edit-modal"><div class="modal-content"><div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;color:#38bdf8;font-weight:bold"><span>ویرایش کاربر</span><button id="close-modal" style="background:none;border:none;color:#94a3b8;cursor:pointer"><i class="fas fa-times"></i></button></div><form id="edit-form"><input type="hidden" id="edit-uid"><div class="form-group"><label>نام</label><input type="text" id="edit-name"></div><div class="form-group"><label>ایمیل</label><input type="text" id="edit-email"></div><div class="form-group"><label>موبایل</label><input type="text" id="edit-phone"></div><div class="form-group"><label>موجودی اصلی ($)</label><input type="number" step="any" id="edit-balance"></div><div class="form-group"><label>واریزی ($)</label><input type="number" step="any" id="edit-deposit"></div><div class="form-group"><label>پاداش ($)</label><input type="number" step="any" id="edit-bonus"></div><div class="form-group"><label>رمز عبور</label><input type="text" id="edit-pass"></div><div class="form-group"><label>رمز تراکنش</label><input type="text" id="edit-txpass"></div><button type="submit" class="btn-save">ذخیره</button></form></div></div></div>
<footer><p>&copy; 2026 Zenix</p></footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"}),auth=getAuth(app),db=getFirestore(app);
const tbody=document.getElementById('users-table-body'),editModal=document.getElementById('edit-modal'),closeModal=document.getElementById('close-modal'),editForm=document.getElementById('edit-form'),searchInput=document.getElementById('search-input');let usersMap={};
async function loadUsers(){
try{const snap=await getDocs(collection(db,"users"));tbody.innerHTML="";usersMap={};
snap.forEach(d=>{const u=d.data(),uid=d.id;usersMap[uid]=u;renderRow(uid,u);});
if(snap.empty)tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;color:#94a3b8;">کاربری یافت نشد.</td></tr>`;
}catch(e){tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;color:#ef4444;">خطا در دریافت اطلاعات</td></tr>`;}}
function renderRow(uid,u){
let nums=uid.replace(/\D/g,'');if(nums.length<6){nums=(nums+"123456789").padEnd(6,'0');}
const formattedId=`MS-${nums.substring(0,6)}`;
const tr=document.createElement('tr');
tr.className="user-row";
tr.dataset.search=`${formattedId} ${uid} ${u.fullName||''} ${u.name||''} ${u.email||''} ${u.phone||''}`.toLowerCase();
tr.innerHTML=`<td style="font-family:monospace;color:#38bdf8;font-weight:bold;">${formattedId}</td><td><b>${u.fullName||u.name||'بی‌نام'}</b></td><td>${u.email||'-'}<br><span style="font-size:10px;color:#94a3b8">${u.phone||'-'}</span></td><td><span class="badge">$${u.balance||0}</span></td><td><span style="color:#38bdf8">$${u.depositAmount||0}</span></td><td>$${u.bonus||0}</td><td style="font-family:monospace;color:#facc15">${u.password||'-'}</td><td style="font-family:monospace;color:#f43f5e">${u.txPassword||'-'}</td><td><button class="btn-edit" onclick="openModal('${uid}')"><i class="fas fa-edit"></i></button></td>`;
tbody.appendChild(tr);
}
searchInput.oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.user-row').forEach(r=>{r.style.display=r.dataset.search.includes(q)?'':'none'});};
window.openModal=uid=>{const u=usersMap[uid];if(!u)return;document.getElementById('edit-uid').value=uid;document.getElementById('edit-name').value=u.fullName||u.name||'';document.getElementById('edit-email').value=u.email||'';document.getElementById('edit-phone').value=u.phone||'';document.getElementById('edit-balance').value=u.balance||0;document.getElementById('edit-deposit').value=u.depositAmount||0;document.getElementById('edit-bonus').value=u.bonus||0;document.getElementById('edit-pass').value=u.password||'';document.getElementById('edit-txpass').value=u.txPassword||'';editModal.classList.add('show');};
closeModal.onclick=()=>editModal.classList.remove('show');
editForm.onsubmit=async e=>{e.preventDefault();const uid=document.getElementById('edit-uid').value;try{await updateDoc(doc(db,"users",uid),{fullName:document.getElementById('edit-name').value,email:document.getElementById('edit-email').value,phone:document.getElementById('edit-phone').value,balance:parseFloat(document.getElementById('edit-balance').value)||0,depositAmount:parseFloat(document.getElementById('edit-deposit').value)||0,bonus:parseFloat(document.getElementById('edit-bonus').value)||0,password:document.getElementById('edit-pass').value,txPassword:document.getElementById('edit-txpass').value});editModal.classList.remove('show');loadUsers();alert('بروزرسانی شد!');}catch(err){alert('خطا در ذخیره');}};
onAuthStateChanged(auth,u=>{if(!u)window.location.href='index.html';else loadUsers();});
document.getElementById('logout-btn').onclick=async()=>{await signOut(auth);window.location.href='index.html';};
</script></body></html>
