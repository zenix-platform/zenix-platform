<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix - Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}header{background:rgba(15,23,42,.95);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo h2{font-size:16px;color:#38bdf8;font-weight:800}.btn-logout{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}.c{max-width:1200px;width:100%;margin:15px auto;padding:0 12px;flex:1}.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}.search-box{position:relative;flex:1;max-width:300px}.search-box input{width:100%;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 12px 8px 32px;color:#fff;font-size:12px;outline:none}.panel-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;overflow:hidden}.table-responsive{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:right;font-size:11px}th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}th{color:#94a3b8;font-weight:600;background:rgba(255,255,255,.02)}td{color:#cbd5e1}.badge{background:rgba(34,197,94,.15);color:#22c55e;padding:2px 6px;border-radius:4px;font-weight:600}.btn-edit,.btn-approve,.btn-reject{padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;margin-left:4px}.btn-edit{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8}.btn-approve{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#22c55e}.btn-reject{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal.show{display:flex}.modal-content{background:#0f172a;border:1px solid rgba(56,189,248,.3);border-radius:12px;width:100%;max-width:420px;padding:18px;max-height:90vh;overflow-y:auto}.form-group{margin-bottom:10px}.form-group label{display:block;font-size:10px;color:#94a3b8;margin-bottom:3px}.form-group input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 10px;color:#fff;font-size:12px;outline:none}.btn-save{width:100%;background:#0284c7;color:#fff;border:none;padding:9px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:12px}footer{text-align:center;padding:10px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.05)}</style></head><body>
<header><div class="logo"><h2>ZENIX ADMIN</h2></div><button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button></header>
<div class="c">
<div class="top-bar">
<div style="font-size:14px;color:#38bdf8;font-weight:700"><i class="fas fa-users"></i> مدیریت کاربران</div>
<div class="search-box"><input type="text" id="search-input" placeholder="جستجو..."><i class="fas fa-search" style="position:absolute;top:10px;left:10px;color:#94a3b8"></i></div>
</div>
<div class="panel-box"><div class="table-responsive"><table><thead><tr><th>ID</th><th>نام</th><th>ایمیل فعلی</th><th>ایمیل جدید</th><th>سلفی</th><th>موجودی</th><th>عملیات</th></tr></thead><tbody id="users-table-body"><tr><td colspan="7" style="text-align:center;color:#94a3b8;">در حال بارگذاری...</td></tr></tbody></table></div></div>
</div>
<div class="modal" id="edit-modal"><div class="modal-content"><div style="display:flex;justify-content:space-between;margin-bottom:12px;color:#38bdf8;font-weight:bold"><span>ویرایش</span><button id="close-modal" style="background:none;border:none;color:#94a3b8;cursor:pointer"><i class="fas fa-times"></i></button></div><form id="edit-form"><input type="hidden" id="edit-uid"><div class="form-group"><label>نام</label><input type="text" id="edit-name"></div><div class="form-group"><label>ایمیل</label><input type="text" id="edit-email"></div><div class="form-group"><label>موبایل</label><input type="text" id="edit-phone"></div><div class="form-group"><label>موجودی ($)</label><input type="number" step="any" id="edit-balance"></div><button type="submit" class="btn-save">ذخیره</button></form></div></div></div>
<div class="modal" id="selfie-modal"><div class="modal-content" style="text-align:center;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;color:#38bdf8;font-weight:bold"><span>سلفی کاربر</span><button id="close-selfie" style="background:none;border:none;color:#94a3b8;cursor:pointer"><i class="fas fa-times"></i></button></div><img id="selfie-img-preview" src="" style="width:100%;max-height:350px;object-fit:contain;border-radius:8px;margin-bottom:12px;"><div style="display:flex;gap:6px"><button type="button" class="btn-approve" style="flex:1;padding:8px;" id="modal-approve-btn">تایید</button><button type="button" class="btn-reject" style="flex:1;padding:8px;" id="modal-reject-btn">رد</button></div></div></div>
<footer><p>&copy; 2026 Zenix</p></footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"}),auth=getAuth(app),db=getFirestore(app);
let usersMap={},activeTargetUid=null,activePendingEmail=null;
const tb=document.getElementById('users-table-body'),editM=document.getElementById('edit-modal'),selfieM=document.getElementById('selfie-modal');

async function loadUsers(){
try{const snap=await getDocs(collection(db,"users"));tb.innerHTML="";usersMap={};
snap.forEach(d=>{const u=d.data(),uid=d.id;usersMap[uid]=u;renderRow(uid,u);});
if(snap.empty)tb.innerHTML=`<tr><td colspan="7" style="text-align:center;color:#f59e0b;">کاربری یافت نشد</td></tr>`;
}catch(e){tb.innerHTML=`<tr><td colspan="7" style="text-align:center;color:#ef4444;">خطا در بارگذاری</td></tr>`;}}

function renderRow(uid,u){
let id=`MS-${(uid.replace(/\D/g,'')+"123456789").substring(0,6)}`;
let req=u.pendingEmail||u.newEmail||'';
let selfieBtn=u.selfieImage?`<button class="btn-approve" onclick="openS('${uid}')">مشاهده</button>`:`-`;
let acts=req?`<button class="btn-approve" onclick="appEmail('${uid}','${req}')">تایید</button><button class="btn-reject" onclick="rejEmail('${uid}')">رد</button>`:`<span class="badge">عادی</span>`;
let tr=document.createElement('tr');
tr.className="user-row";
tr.dataset.search=`${id} ${u.fullName||''} ${u.name||''} ${u.email||''} ${req}`.toLowerCase();
tr.innerHTML=`<td style="color:#38bdf8;font-weight:bold">${id}</td><td><b>${u.fullName||u.name||'بی‌نام'}</b></td><td>${u.email||'-'}</td><td style="color:#f59e0b">${req||'-'}</td><td>${selfieBtn}</td><td><span class="badge">$${u.balance||0}</span></td><td>${acts} <button class="btn-edit" onclick="openE('${uid}')"><i class="fas fa-edit"></i></button></td>`;
tb.appendChild(tr);
}

window.openS=uid=>{let u=usersMap[uid];if(!u)return;activeTargetUid=uid;activePendingEmail=u.pendingEmail||u.newEmail||'';document.getElementById('selfie-img-preview').src=u.selfieImage;selfieM.classList.add('show');};
document.getElementById('close-selfie').onclick=()=>selfieM.classList.remove('show');
document.getElementById('modal-approve-btn').onclick=async()=>{if(activeTargetUid&&activePendingEmail)await window.appEmail(activeTargetUid,activePendingEmail);selfieM.classList.remove('show');};
document.getElementById('modal-reject-btn').onclick=async()=>{if(activeTargetUid)await window.rejEmail(activeTargetUid);selfieM.classList.remove('show');};

window.appEmail=async(uid,newEmail)=>{if(!confirm(`تایید ایمیل به ${newEmail}؟`))return;await updateDoc(doc(db,"users",uid),{email:newEmail,pendingEmail:"",newEmail:"",selfieImage:"",adminApprovalStatus:"approved"});alert('تایید شد');loadUsers();};
window.rejectEmailChange=window.rejEmail=async(uid)=>{if(!confirm('رد درخواست؟'))return;await updateDoc(doc(db,"users",uid),{pendingEmail:"",newEmail:"",selfieImage:"",adminApprovalStatus:"rejected"});alert('رد شد');loadUsers();};

document.getElementById('search-input').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.user-row').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none');};
window.openE=uid=>{let u=usersMap[uid];if(!u)return;document.getElementById('edit-uid').value=uid;document.getElementById('edit-name').value=u.fullName||u.name||'';document.getElementById('edit-email').value=u.email||'';document.getElementById('edit-phone').value=u.phone||'';document.getElementById('edit-balance').value=u.balance||0;editM.classList.add('show');};
document.getElementById('close-modal').onclick=()=>editM.classList.remove('show');

document.getElementById('edit-form').onsubmit=async e=>{e.preventDefault();let uid=document.getElementById('edit-uid').value;await updateDoc(doc(db,"users",uid),{fullName:document.getElementById('edit-name').value,email:document.getElementById('edit-email').value,phone:document.getElementById('edit-phone').value,balance:parseFloat(document.getElementById('edit-balance').value)||0});editM.classList.remove('show');loadUsers();alert('ذخیره شد');};
onAuthStateChanged(auth,u=>{if(!u)window.location.href='index.html';else loadUsers();});
document.getElementById('logout-btn').onclick=async()=>{await signOut(auth);window.location.href='index.html';};
</script></body></html>
