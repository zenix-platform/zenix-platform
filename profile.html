<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix - پروفایل کاربری</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}header{background:rgba(15,23,42,.95);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.logo h2{font-size:16px;color:#38bdf8;font-weight:800}.btn-logout{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}.c{max-width:600px;width:100%;margin:20px auto;padding:0 12px;flex:1}.panel-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px;margin-bottom:15px}.panel-title{font-size:14px;color:#38bdf8;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:11px;color:#94a3b8;margin-bottom:4px}.form-group input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:9px 12px;color:#fff;font-size:12px;outline:none}.form-group input:focus{border-color:#38bdf8}.form-group input:read-only{background:rgba(255,255,255,.02);color:#64748b;border-color:rgba(255,255,255,.05);cursor:not-allowed}.btn-main{width:100%;background:#0284c7;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px;margin-top:5px}.btn-main:hover{background:#0369a1}footer{text-align:center;padding:10px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.05)</style></head><body>
<header><div class="logo"><h2>ZENIX PROFILE</h2></div><button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button></header>
<div class="c">
<div class="panel-box">
<div class="panel-title"><i class="fas fa-user-circle"></i> اطلاعات حساب کاربری</div>
<div class="form-group"><label>شناسه پلتفرم (ID)</label><input type="text" id="view-uid" readonly></div>
<div class="form-group"><label>نام و نام خانوادگی</label><input type="text" id="view-name" readonly></div>
<div class="form-group"><label>ایمیل فعلی</label><input type="text" id="view-email" readonly></div>
</div>

<div class="panel-box">
<div class="panel-title"><i class="fas fa-envelope-open-text"></i> درخواست تغییر ایمیل</div>
<div id="pending-status-box" style="margin-bottom:10px;font-size:11px;color:#f59e0b;"></div>
<form id="email-change-form">
<div class="form-group"><label>ایمیل جدید</label><input type="email" id="new-email-input" placeholder="ایمیل جدید خود را وارد کنید" required></div>
<div class="form-group"><label>تصویر سلفی همراه با کارت شناسایی/مدارک</label><input type="file" id="selfie-file-input" accept="image/*" style="padding:6px;" required></div>
<button type="submit" class="btn-main" id="submit-request-btn">ارسال درخواست تغییر ایمیل</button>
</form>
</div>
</div>
<footer><p>&copy; 2026 Zenix</p></footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,doc,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"}),auth=getAuth(app),db=getFirestore(app);
let currentUserUid=null;
onAuthStateChanged(auth,async user=>{if(!user){window.location.href='index.html';return;}
currentUserUid=user.uid;
try{const docSnap=await getDoc(doc(db,"users",user.uid));if(docSnap.exists()){const data=docSnap.data();
let nums=user.uid.replace(/\D/g,'');if(nums.length<6)nums=(nums+"123456789").padEnd(6,'0');
document.getElementById('view-uid').value=`MS-${nums.substring(0,6)}`;
document.getElementById('view-name').value=data.fullName||data.name||'بدون نام';
document.getElementById('view-email').value=data.email||user.email||'';
if(data.pendingEmail){document.getElementById('pending-status-box').innerHTML=`<i class="fas fa-clock"></i> درخواست تغییر ایمیل به (${data.pendingEmail}) در حال بررسی توسط ادمین است.`;}
}}catch(e){console.error(e);}});

document.getElementById('email-change-form').onsubmit=async e=>{e.preventDefault();const newEmail=document.getElementById('new-email-input').value;const fileInput=document.getElementById('selfie-file-input');if(!fileInput.files[0])return alert('لطفا عکس سلفی خود را انتخاب کنید.');const file=fileInput.files[0];
if(file.size>800000){alert('حجم عکس بالاست. لطفا عکسی با حجم کمتر از 700 کیلوبایت انتخاب کنید.');return;}
const reader=new FileReader();reader.onload=async function(event){const base64Image=event.target.result;try{document.getElementById('submit-request-btn').disabled=true;document.getElementById('submit-request-btn').innerText='در حال ارسال...';await updateDoc(doc(db,"users",currentUserUid),{pendingEmail:newEmail,selfieImage:base64Image,adminApprovalStatus:"pending"});alert('درخواست شما با موفقیت ثبت شد و پس از بررسی ادمین اعمال خواهد شد.');location.reload();}catch(err){alert('خطا در ارسال درخواست: '+err.message);document.getElementById('submit-request-btn').disabled=false;document.getElementById('submit-request-btn').innerText='ارسال درخواست تغییر ایمیل';}};reader.readAsDataURL(file);};
document.getElementById('logout-btn').onclick=async()=>{await signOut(auth);window.location.href='index.html';};
</script></body></html>
