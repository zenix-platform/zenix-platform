<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.logo h2{font-size:18px;color:#38bdf8;font-weight:800}.hr{display:flex;align-items:center;gap:8px}.wrap{position:relative!important}.lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none}.badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}.menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;min-width:160px;max-height:240px;overflow-y:auto;padding:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}[dir="rtl"] .wrap .menu{left:0!important;right:auto!important}.menu.show{display:block}.mi{padding:7px 10px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none}.mi:hover{background:rgba(56,189,248,.2);color:#38bdf8}.c{max-width:800px;width:100%;margin:15px auto;padding:0 12px;flex:1}.wel{background:linear-gradient(135deg,rgba(2,132,199,.15),rgba(147,51,234,.15));border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:15px;margin-bottom:12px}.card{background:rgba(30,41,59,0.8);border:1px solid rgba(56,189,248,0.3);border-radius:12px;padding:20px;margin-top:12px}.hd{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}.hd i.ch{transition:0.3s;color:#38bdf8}.card.open .hd i.ch{transform:rotate(180deg)}.bd{display:none;margin-top:15px;border-top:1px solid rgba(255,255,255,0.1);padding-top:15px}.fg{margin-bottom:15px}.fl{display:block;font-size:14px;color:#94a3b8;margin-bottom:6px}.fi{width:100%;padding:10px 14px;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f8fafc;font-size:14px;outline:none}.fi:focus{border-color:#38bdf8}.fi[readonly],input[readonly]{opacity:0.7;background:rgba(15,23,42,0.4)!important;cursor:not-allowed}.err-msg{color:#ef4444;font-size:12px;margin-top:4px;display:none}.success-msg{color:#22c55e;font-size:13px;margin-top:10px;display:none;text-align:center;font-weight:bold}.bs{display:block;width:100%;background:#38bdf8;color:#0f172a;border:none;padding:10px;font-weight:bold;border-radius:8px;cursor:pointer;font-size:14px;text-align:center}.bs:hover{background:#0ea5e9}.ibox{display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,0.6);padding:12px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);margin-bottom:12px}footer{text-align:center;padding:10px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05)}</style></head><body>
<header><div class="logo"><h2>ZENIX</h2></div><div class="hr"><div class="wrap"><a href="support.html" class="lb"><i class="fas fa-headset"></i></a><div class="wrap"><button type="button" class="lb" id="menu-btn"><i class="fas fa-bars"></i></button><div class="menu" id="nav-menu"><a href="dashboard.html" class="mi"><i class="fas fa-home"></i><span>صفحه اصلی</span></a><a href="profile.html" class="mi" style="color:#38bdf8;"><i class="fas fa-user-cog"></i><span>پروفایل</span></a><a href="#" class="mi" id="logout-btn" style="color:#ef4444;"><i class="fas fa-sign-out-alt"></i><span>خروج</span></a></div></div></div></header>

<div class="c">
<div class="wel"><div><h1 id="pt" style="font-size:18px;margin-bottom:3px;">پروفایل کاربر</h1><p id="pd" style="font-size:12px;color:#94a3b8;">مدیریت اطلاعات حساب کاربری و تنظیمات امنیتی</p></div></div>
<div class="card" style="cursor:default;"><div style="display:flex;align-items:center;gap:15px;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:15px;"><div style="width:50px;height:50px;background:rgba(56,189,248,0.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#38bdf8;"><i class="fas fa-user"></i></div><div><div style="font-size:16px;font-weight:bold;color:#f8fafc;" id="user-fullname">Loading...</div><div style="font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-top:2px;"><span id="user-id">ID: MS-000000</span></div></div></div>
<div class="ibox"><span style="color:#94a3b8;font-size:13px;">وضعیت حساب:</span><span id="account-status" style="font-weight:bold;font-size:13px;">تایید نشده</span></div></div>

<div class="card"><div class="hd" onclick="tc(this)"><h3 style="color:#38bdf8;font-size:15px;margin:0;"><i class="fas fa-envelope"></i> <span>تغییر جمیل (ایمیل)</span></h3><i class="fas fa-chevron-down ch"></i></div><div class="bd"><div class="fg"><label class="fl">ایمیل فعلی</label><input type="email" class="fi" id="email-curr" readonly></div><div class="fg"><label class="fl">ایمیل جدید</label><div style="display:flex;gap:8px;"><input type="email" class="fi" id="email-new"><button type="button" class="bs" id="req-admin-btn" style="width:190px;font-size:12px;background:#f59e0b;color:#0f172a;" onclick="requestAdminPermission()">گرفتن عکس و ارسال به ادمین</button></div><input type="file" id="selfie-capture" accept="image/*" capture="user" style="display:none" onchange="previewSelfie(this)"></div><div id="admin-status-box" style="margin-top:15px;padding:10px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;font-size:13px;color:#f59e0b;display:none;text-align:center;"><i class="fas fa-clock"></i> در انتظار تایید مدیریت...</div></div></div></div>

<!-- مودال پیش‌نمایش و تایید نهایی سلفی -->
<div class="modal" id="user-selfie-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;"><div class="modal-content" style="background:#0f172a;border:1px solid rgba(56,189,248,.3);border-radius:12px;width:100%;max-width:380px;padding:16px;text-align:center;"><div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:#38bdf8;font-weight:bold"><span>پیش‌نمایش عکس سلفی</span><button type="button" onclick="closeUserSelfieModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer"><i class="fas fa-times"></i></button></div><img id="user-selfie-preview" src="" style="width:100%;max-height:280px;object-fit:contain;border-radius:8px;border:1px solid rgba(255,255,255,0.1);margin-bottom:12px;"><button type="button" class="bs" onclick="confirmAndSendSelfie()" style="background:#22c55e;color:#fff;">تایید و ارسال نهایی به ادمین</button></div></div>

<footer><p>&copy; 2026 Zenix</p></footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,doc,onSnapshot,updateDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f",measurementId:"G-LXSGYB8WKM"}),auth=getAuth(app),db=getFirestore(app);
let currentUser=null;let capturedBase64Image="";

onAuthStateChanged(auth,u=>{
if(!u){window.location.href='index.html';return;}
currentUser=u;

onSnapshot(doc(db,"users",u.uid),d=>{
if(d.exists()){
const data=d.data();
document.getElementById('user-fullname').textContent=data.fullName||data.name||"کاربر عزیز";
if(data.email) document.getElementById('email-curr').value=data.email;

let nums=u.uid.replace(/\D/g,'');if(nums.length<6)nums=(nums+"123456789").padEnd(6,'0');
document.getElementById('user-id').textContent=`ID: MS-${nums.substring(0,6)}`;

const reqBtn=document.getElementById('req-admin-btn');
const statusBox=document.getElementById('admin-status-box');

if(data.pendingEmail){
document.getElementById('email-new').value=data.pendingEmail;
reqBtn.setAttribute('disabled','true');
reqBtn.style.opacity='0.6';
statusBox.style.display='block';
}else{
document.getElementById('email-new').value='';
reqBtn.removeAttribute('disabled');
reqBtn.style.opacity='1';
statusBox.style.display='none';
}
}
});
});

window.requestAdminPermission=function(){
const newEmail=document.getElementById('email-new').value.trim();
if(!newEmail||!newEmail.includes('@')){alert('لطفا یک ایمیل معتبر وارد کنید');return;}
document.getElementById('selfie-capture').click();
};

window.previewSelfie=function(input){
if(input.files&&input.files[0]){
const reader=new FileReader();
reader.onload=function(e){
// فشرده‌سازی سبک بیس‌فد تصویر برای جلوگیری از قطعی حجم بالا در فایربیس
const img = new Image();
img.src = e.target.result;
img.onload = function(){
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
let width = img.width;
let height = img.height;
const maxDim = 600; // محدود کردن ابعاد برای کاهش حجم دیتابیس
if(width > height && width > maxDim){ height *= maxDim / width; width = maxDim; }
else if(height > maxDim){ width *= maxDim / height; height = maxDim; }
canvas.width = width;
canvas.height = height;
ctx.drawImage(img, 0, 0, width, height);
capturedBase64Image = canvas.toDataURL('image/jpeg', 0.6); // کیفیت 60% برای کمترین حجم

document.getElementById('user-selfie-preview').src=capturedBase64Image;
document.getElementById('user-selfie-modal').style.display='flex';
}
};
reader.readAsDataURL(input.files[0]);
}
};

window.closeUserSelfieModal=function(){
document.getElementById('user-selfie-modal').style.display='none';
document.getElementById('selfie-capture').value="";
};

window.confirmAndSendSelfie=async function(){
if(!currentUser||!capturedBase64Image)return;
const newEmail=document.getElementById('email-new').value.trim();
try{
await updateDoc(doc(db,"users",currentUser.uid),{
pendingEmail: newEmail,
selfieImage: capturedBase64Image,
requestTime: new Date().toISOString(),
adminApprovalStatus: 'pending' // این فیلد دقیقاً همون چیزیه که پنل ادمین شما برای چک کردن نیاز داره
});
document.getElementById('user-selfie-modal').style.display='none';
document.getElementById('req-admin-btn').setAttribute('disabled','true');
document.getElementById('req-admin-btn').style.opacity='0.6';
document.getElementById('admin-status-box').style.display='block';
alert('درخواست شما با موفقیت برای ادمین ارسال شد.');
}catch(err){
alert('خطا در ارسال اطلاعات به سرور.');
}
};
</script>
<script>
window.tc=function(e){const card=e.closest('.card'),bd=card.querySelector('.bd'),isOpen=card.classList.contains('open');document.querySelectorAll('.card').forEach(c=>{if(c!==card){c.classList.remove('open');const b=c.querySelector('.bd');if(b)b.style.display='none';}});if(isOpen){card.classList.remove('open');bd.style.display='none';}else{card.classList.add('open');bd.style.display='block';}}
const mBtn=document.getElementById('menu-btn'),nMenu=document.getElementById('nav-menu');
if(mBtn)mBtn.onclick=e=>{e.stopPropagation();nMenu.classList.toggle('show');};
document.onclick=()=>{if(nMenu)nMenu.classList.remove('show');};
const lo=document.getElementById('logout-btn');if(lo)lo.onclick=async e=>{e.preventDefault();await signOut(auth);window.location.href='index.html';};
</script></body></html>
