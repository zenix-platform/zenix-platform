<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo{display:flex;align-items:center;gap:8px}
        .logo svg{width:32px;height:32px;border-radius:6px}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .c{max-width:900px;width:100%;margin:15px auto;padding:0 12px;flex:1}
        .brand-logo-banner{background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(30,41,59,.95));border:1px solid rgba(56,189,248,.35);border-radius:14px;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(2,132,199,.15)}
        .brand-logo-left{display:flex;align-items:center;gap:14px}
        .brand-logo-icon{width:56px;height:56px;border-radius:12px;overflow:hidden;box-shadow:0 0 20px rgba(56,189,248,.4);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.1)}
        .brand-logo-icon svg{width:100%;height:100%}
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="zg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="50%" stop-color="#8b5cf6"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                </defs>
                <rect width="100" height="100" rx="22" fill="#0f172a"/>
                <path d="M30 32 H70 L42 68 H70" stroke="url(#zg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <h2>ZENIX</h2>
        </div>
    </header>
    <div class="c">
        <div class="brand-logo-banner">
            <div class="brand-logo-left">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" rx="22" fill="#0f172a"/>
                        <path d="M30 32 H70 L42 68 H70" stroke="url(#zg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </div>
                <div>
                    <h3>ZENIX PLATFORM</h3>
                    <p>Advanced AI Trading & Security</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
