<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix Dashboard</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.logo-zoom-wrap{height:36px;width:130px;border-radius:6px;overflow:hidden;border:1px solid rgba(56,189,248,.4);position:relative;background:#0f172a;display:flex;align-items:center;justify-content:center}.logo-zoom-wrap img{width:190px;position:absolute;top:-40px;left:-20px;object-fit:cover;filter:contrast(1.15) brightness(1.1)}.hr{display:flex;gap:8px}.wrap{position:relative}.lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none}.badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:700}.badge.show{display:flex}.menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;min-width:160px;max-height:240px;overflow-y:auto;padding:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}[dir="rtl"] .wrap .menu{left:0}[dir="ltr"] .wrap .menu{right:0}.menu.show{display:block}.mi{padding:7px 10px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none}.mi:hover{background:rgba(56,189,248,.2);color:#38bdf8}.c{max-width:900px;width:100%;margin:15px auto;padding:0 12px;flex:1}.wel{background:linear-gradient(135deg,rgba(2,132,199,.15),rgba(147,51,234,.15));border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.wel h1{font-size:16px}.wel p{color:#94a3b8;font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}.sc{border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}.sc-bal{background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(14,165,233,.18));border:1px solid rgba(56,189,248,.4)}.sc-ref{background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(168,85,247,.18));border:1px solid rgba(168,85,247,.4)}.si{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}.sc-bal .si{background:rgba(56,189,248,.2);border:1px solid #38bdf8;color:#38bdf8}.sc-ref .si{background:rgba(168,85,247,.2);border:1px solid #a855f7;color:#c084fc}.sn span{font-size:11px;color:#94a3b8}.sn h3{font-size:16px;font-weight:800}.banner-box{width:100%;height:140px;margin-bottom:12px;border-radius:12px;overflow:hidden;border:1px solid rgba(56,189,248,.35)}.banner-box img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.nc{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:space-between}.nc:hover{border-color:#38bdf8;background:#0f172a}.ncl{display:flex;align-items:center;gap:10px}.nci{width:38px;height:38px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:14px}.ninf h3{font-size:14px;margin-bottom:2px}.ninf p{font-size:11px;color:#94a3b8}.mbx{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;margin-bottom:12px}#ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:350px;overflow-y:auto;padding-right:4px}@media(max-width:768px){#ctl{grid-template-columns:1fr}}@keyframes fUp{0%{background:rgba(34,197,94,.4)}100%{background:rgba(255,255,255,.03)}}@keyframes fDn{0%{background:rgba(239,68,68,.4)}100%{background:rgba(255,255,255,.03)}}.cr{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid rgba(255,255,255,.05);font-size:11px;direction:ltr}.f-up{animation:fUp .8s ease}.f-dn{animation:fDn .8s ease}.pu{color:#22c55e;font-weight:700}.pd{color:#ef4444;font-weight:700}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,23,.85);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(10px)}.modal.show{display:flex}.mc{background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(56,189,248,.3);border-radius:20px;width:100%;max-width:440px;max-height:85vh;padding:22px}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:#38bdf8;font-weight:800;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:10px}.m-cl{background:rgba(255,255,255,.05);border:none;color:#94a3b8;cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}.mbb{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}.mbt{font-size:13px;font-weight:700;color:#38bdf8;margin-bottom:4px}.mbd{font-size:12px;color:#cbd5e1;line-height:1.5}footer{text-align:center;padding:10px;font-size:11px;color:#64748b;display:flex;justify-content:space-between;max-width:900px;margin:0 auto}</style></head><body><header><div class="logo"><div class="logo-zoom-wrap"><img src="https://i.postimg.cc/XvHYmsLK/Gemini-Generated-Image-d7mieqd7mieqd7mi.jpg" alt="Logo"></div></div><div class="hr"><div class="wrap"><button class="lb" id="b-btn"><i class="fas fa-bell"></i><span class="badge" id="bb">0</span></button></div><div class="wrap"><button class="lb" id="h-btn"><i class="fas fa-circle-question"></i></button></div><div class="wrap"><button class="lb" id="m-btn"><i class="fas fa-bars"></i></button><div class="menu" id="nm"><a href="dashboard.html" class="mi"><i class="fas fa-home"></i>اصلی</a><a href="quantification.html" class="mi"><i class="fas fa-robot"></i>کوانت</a><a href="deposit.html" class="mi"><i class="fas fa-plus"></i>واریز</a><a href="receive.html" class="mi"><i class="fas fa-minus"></i>برداشت</a><a href="index.html" class="mi" id="lo" style="color:#ef4444"><i class="fas fa-sign-out-alt"></i>خروج</a></div></div></div></header><div class="c"><div class="wel"><div><h1 id="tw">خوش آمدید</h1><p id="ts">پنل کاربری</p></div><div style="font-size:11px;background:rgba(56,189,248,.1);border:1px solid #38bdf8;padding:4px 8px;border-radius:6px;color:#38bdf8"><i class="fas fa-check"></i> تایید شده</div></div><div class="stats"><div class="sc sc-bal"><div class="si"><i class="fas fa-wallet"></i></div><div class="sn"><span id="sb">موجودی</span><h3 id="vb">$0.00</h3></div></div><div class="sc sc-ref"><div class="si"><i class="fas fa-users"></i></div><div class="sn"><span id="sr">زیرمجموعه</span><h3 id="vr">0</h3></div></div></div><div class="banner-box"><img src="https://i.postimg.cc/XvHYmsLK/Gemini-Generated-Image-d7mieqd7mieqd7mi.jpg" alt="Banner"></div><div class="grid"><a href="quantification.html" class="nc"><div class="ncl"><div class="nci"><i class="fas fa-robot"></i></div><div class="ninf"><h3>کوانت</h3><p>معاملات</p></div></div><i class="fas fa-chevron-left" style="color:#64748b;font-size:12px"></i></a><a href="deposit.html" class="nc"><div class="ncl"><div class="nci"><i class="fas fa-arrow-up"></i></div><div class="ninf"><h3>واریز</h3><p>شارژ</p></div></div><i class="fas fa-chevron-left" style="color:#64748b;font-size:12px"></i></a><a href="receive.html" class="nc"><div class="ncl"><div class="nci"><i class="fas fa-arrow-down"></i></div><div class="ninf"><h3>برداشت</h3><p>برداشت</p></div></div><i class="fas fa-chevron-left" style="color:#64748b;font-size:12px"></i></a><a href="team.html" class="nc"><div class="ncl"><div class="nci"><i class="fas fa-users"></i></div><div class="ninf"><h3>تیم</h3><p>شبکه</p></div></div><i class="fas fa-chevron-left" style="color:#64748b;font-size:12px"></i></a></div><div class="mbx"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="font-size:13px;color:#38bdf8"><i class="fas fa-chart-line"></i> رصد ۵۰ ارز برتر (پویا و لحظه‌ای)</h3><span style="font-size:10px;color:#22c55e;background:rgba(34,197,94,.15);padding:2px 8px;border-radius:10px"><i class="fas fa-circle" style="font-size:6px"></i> زنده</span></div><div id="ctl"></div></div></div><div class="modal" id="msgM"><div class="mc"><div class="mh"><span>پیام‌ها</span><button class="m-cl" onclick="document.getElementById('msgM').classList.remove('show')"><i class="fas fa-times"></i></button></div><div id="mC"><div style="text-align:center;padding:20px;color:#94a3b8">پیامی نیست.</div></div></div></div><div class="modal" id="hlpM"><div class="mc"><div class="mh"><span>راهنما</span><button class="m-cl" onclick="document.getElementById('hlpM').classList.remove('show')"><i class="fas fa-times"></i></button></div><div style="overflow-y:auto"><div class="mbb"><div class="mbt">کوانت</div><div class="mbd">سودآوری خودکار.</div></div></div></div></div><footer><p>&copy; 2026 Zenix.</p><p style="color:#22c55e"><i class="fas fa-circle" style="font-size:6px"></i> متصل</p></footer><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,doc,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyAqIksPfjCCQZNQDVx3MEdDyJyNMaTvtlk",authDomain:"zenix-platform.firebaseapp.com",projectId:"zenix-platform",storageBucket:"zenix-platform.firebasestorage.app",messagingSenderId:"594936010622",appId:"1:594936010622:web:9f4159c80111245062052f"}),auth=getAuth(app),db=getFirestore(app);let msgs=[],uid=null;document.getElementById('b-btn').onclick=e=>{e.stopPropagation();let c=document.getElementById('mC');if(msgs.length>0){c.innerHTML=msgs.map(m=>`<div class="mbb"><div class="mbt">${m.subject||'پیام'}</div><div class="mbd">${m.body||''}</div></div>`).join('');if(uid)updateDoc(doc(db,"users",uid),{"adminMessage":msgs.map(m=>({...m,read:true}))}).then(()=>{document.getElementById('bb').classList.remove('show')})}document.getElementById('msgM').classList.add('show')};document.getElementById('h-btn').onclick=e=>{e.stopPropagation();document.getElementById('hlpM').classList.add('show')};onAuthStateChanged(auth,async u=>{if(!u)return window.location.href='index.html';uid=u.uid;let snap=await getDoc(doc(db,"users",uid));if(snap.exists()){let dt=snap.data();document.getElementById('vb').textContent=`$${(dt.balance||0).toFixed(2)}`;if(dt.adminMessage){msgs=Array.isArray(dt.adminMessage)?dt.adminMessage:[dt.adminMessage];let un=msgs.filter(m=>!m.read).length;if(un>0){let b=document.getElementById('bb');b.textContent=un;b.classList.add('show')}}document.getElementById('vr').textContent=(dt.gen1Count||0)+(dt.gen2Count||0)}});let mBtn=document.getElementById('m-btn'),nMenu=document.getElementById('nm');mBtn.onclick=e=>{e.stopPropagation();nMenu.classList.toggle('show')};document.onclick=()=>nMenu.classList.remove('show');if(document.getElementById('lo'))document.getElementById('lo').onclick=()=>{signOut(auth);window.location.href='index.html'};let coins=[{s:'BTC',n:'Bitcoin',p:94517,ch:1.2},{s:'ETH',n:'Ethereum',p:3480,ch:2.1},{s:'SOL',n:'Solana',p:189,ch:3.4},{s:'BNB',n:'Binance',p:615,ch:0.8},{s:'XRP',n:'Ripple',p:1.45,ch:4.1},{s:'DOGE',n:'Dogecoin',p:0.38,ch:5.2},{s:'ADA',n:'Cardano',p:0.75,ch:-0.5},{s:'AVAX',n:'Avalanche',p:32.4,ch:1.5},{s:'LINK',n:'Chainlink',p:18.2,ch:0.3},{s:'SHIB',n:'Shiba',p:0.000024,ch:2.8},{s:'DOT',n:'Polkadot',p:7.3,ch:-1.2},{s:'NEAR',n:'Near',p:5.8,ch:1.9},{s:'MATIC',n:'Polygon',p:0.52,ch:0.7},{s:'UNI',n:'Uniswap',p:9.4,ch:1.1},{s:'LTC',n:'Litecoin',p:95.6,ch:0.4},{s:'ATOM',n:'Cosmos',p:6.5,ch:-0.6},{s:'APT',n:'Aptos',p:9.8,ch:2.5},{s:'FTM',n:'Fantom',p:0.72,ch:3.8},{s:'ARB',n:'Arbitrum',p:0.85,ch:1.3},{s:'OP',n:'Optimism',p:1.75,ch:2.2},{s:'INJ',n:'Injective',p:24.5,ch:3.1},{s:'TIA',n:'Celestia',p:5.2,ch:1.0},{s:'RENDER',n:'Render',p:8.9,ch:4.5},{s:'KAS',n:'Kaspa',p:0.14,ch:2.4},{s:'XLM',n:'Stellar',p:0.22,ch:1.6},{s:'TRX',n:'TRON',p:0.24,ch:0.9},{s:'ETC',n:'EthereumC',p:25.8,ch:-0.3},{s:'FIL',n:'Filecoin',p:5.1,ch:1.2},{s:'HBAR',n:'Hedera',p:0.11,ch:3.0},{s:'SUI',n:'Sui',p:3.1,ch:6.1},{s:'ICP',n:'InternetC',p:8.4,ch:-1.5},{s:'GRT',n:'TheGraph',p:0.2,ch:2.1},{s:'RUNE',n:'Thorchain',p:5.4,ch:1.8},{s:'STX',n:'Stacks',p:1.9,ch:3.5},{s:'IMX',n:'Immutable',p:1.6,ch:2.7},{s:'SEI',n:'Sei',p:0.45,ch:4.0},{s:'AR',n:'Arweave',p:22.5,ch:1.1},{s:'OPN',n:'Open',p:1.2,ch:0.5},{s:'PEPE',n:'Pepe',p:0.000012,ch:8.5},{s:'FLOKI',n:'Floki',p:0.00015,ch:6.2},{s:'BONK',n:'Bonk',p:0.000022,ch:7.4},{s:'WIF',n:'Dogwifhat',p:2.1,ch:9.1},{s:'JUP',n:'Jupiter',p:1.1,ch:3.3},{s:'PYTH',n:'Pyth',p:0.35,ch:2.0},{s:'RON',n:'Ronin',p:1.8,ch:1.4},{s:'MANA',n:'Decentraland',p:0.4,ch:-0.8},{s:'SAND',n:'Sandbox',p:0.42,ch:-0.4},{s:'AXS',n:'Axie',p:6.2,ch:1.7},{s:'CHZ',n:'Chiliz',p:0.07,ch:0.3},{s:'ENJ',n:'Enjin',p:0.23,ch:0.6}];function updateMarket(){coins.forEach(c=>{let o=c.ch;c.p=Math.max(0.000001,c.p+(Math.random()-0.48)*(c.p*0.003));c.ch+=(Math.random()-0.5)*0.7;c.up=c.ch>o});coins.sort((a,b)=>b.ch-a.ch);let h='';coins.forEach(c=>{let pu=c.ch>=0,cl=pu?'pu':'pd',f=c.up?'f-up':'f-dn';h+=`<div class="cr ${f}"><div style="display:flex;align-items:center;gap:6px"><div style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#38bdf8;font-size:9px;font-weight:700">${c.s[0]}</div><div><div style="font-weight:700;color:#f8fafc">${c.s}</div></div></div><div style="text-align:right"><div class="${cl}">$${c.p<1?c.p.toFixed(5):c.p.toFixed(2)}</div><div class="${cl}" style="font-size:10px">${pu?'+':''}${c.ch.toFixed(2)}%</div></div></div>`});document.getElementById('ctl').innerHTML=h}updateMarket();setInterval(updateMarket,2500);</script></body></html>
