<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix - Reset Password</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,Tahoma,sans-serif;background-color:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px;position:relative;overflow-x:hidden}.glow-1,.glow-2{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none}.glow-1{width:250px;height:250px;background:#0ea5e9;top:10%;left:10%}.glow-2{width:250px;height:250px;background:#a855f7;bottom:10%;right:10%}.auth-card{width:100%;max-width:400px;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative;z-index:10}.lang-box{position:relative;display:flex;justify-content:flex-end;margin-bottom:12px}.lang-btn{background:rgba(255,255,255,.08);color:#38bdf8;border:1px solid rgba(255,255,255,.15);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s}.lang-btn:hover{background:rgba(56,189,248,.2)}.lang-menu{display:none;position:absolute;top:45px;z-index:9999;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:12px;width:150px;max-height:220px;overflow-y:auto;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.8)}html[dir="rtl"] .lang-menu{left:0}html[dir="ltr"] .lang-menu{right:0}.lang-menu.show{display:block!important}.lang-item{padding:8px 10px;font-size:13px;color:#cbd5e1;cursor:pointer;border-radius:6px;transition:.2s}.lang-item:hover{background:rgba(56,189,248,.2);color:#38bdf8}.logo{text-align:center;margin-bottom:22px}.logo-icon{width:56px;height:56px;margin:0 auto 10px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#38bdf8}.logo h2{font-size:26px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo p{color:#94a3b8;font-size:12px;margin-top:4px}.group{margin-bottom:14px}.group label{display:block;margin-bottom:6px;font-size:12px;color:#cbd5e1}.req{color:#ef4444;font-weight:700;margin-inline-start:3px}.wrap{position:relative;display:flex;align-items:center}.wrap i.f-icon{position:absolute;color:#64748b;font-size:14px}html[dir="rtl"] .wrap i.f-icon{right:14px}html[dir="ltr"] .wrap i.f-icon{left:14px}.group input{width:100%;padding:12px 14px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:13px;outline:0}html[dir="rtl"] .group input{padding-right:40px}html[dir="ltr"] .group input{padding-left:40px}.group input:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.2)}.cap-box{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;margin-bottom:16px}.cap-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}#c-canvas{border-radius:8px;background:#0b1120;border:1px solid rgba(255,255,255,.1);cursor:pointer}.ref-btn{background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:8px;color:#38bdf8;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}.cap-input{text-align:center;letter-spacing:4px;font-weight:700;padding:8px!important}.otp-input{text-align:center;letter-spacing:6px;font-size:16px!important;font-weight:800;color:#38bdf8!important}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s ease}.btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed;box-shadow:none}.footer{text-align:center;margin-top:16px;font-size:12px;color:#94a3b8}.footer a{color:#38bdf8;text-decoration:none;font-weight:700}#msg{margin-top:10px;font-size:12px;text-align:center;font-weight:700;padding:8px;border-radius:8px}.err{color:#ef4444;background:rgba(239,68,68,.1)}.succ{color:#22c55e;background:rgba(34,197,94,.1)}</style></head><body><div class="glow-1"></div><div class="glow-2"></div><div class="auth-card"><div class="lang-box"><button type="button" class="lang-btn" id="lang-btn"><i class="fas fa-globe"></i></button><div class="lang-menu" id="lang-menu"><div class="lang-item" data-lang="fa">فارسی</div><div class="lang-item" data-lang="en">English</div><div class="lang-item" data-lang="ar">العربية</div><div class="lang-item" data-lang="tr">Türkçe</div><div class="lang-item" data-lang="ru">Русский</div><div class="lang-item" data-lang="es">Español</div><div class="lang-item" data-lang="fr">Français</div><div class="lang-item" data-lang="de">Deutsch</div></div></div><div class="logo"><div class="logo-icon"><i class="fas fa-key"></i></div><h2>ZENIX</h2><p id="t-wel">بازیابی رمز عبور حساب کاربری</p></div><form id="form"><div class="group"><label id="l-user"><i class="fas fa-user"></i> نام کاربری یا ایمیل <span class="req">*</span></label><div class="wrap"><i class="fas fa-envelope f-icon"></i><input type="text" id="user" placeholder="ایمیل یا نام کاربری" required></div></div><div class="group"><label id="l-otp"><i class="fas fa-paper-plane"></i> کد ۶ رقمی ایمیل <span class="req">*</span></label><div class="wrap"><i class="fas fa-shield-virus f-icon"></i><input type="text" id="otp-in" class="otp-input" placeholder="------" maxlength="6" required></div></div><div class="group"><label id="l-cap"><i class="fas fa-shield-alt"></i> کد امنیتی <span class="req">*</span></label><div class="cap-box"><div class="cap-row"><canvas id="c-canvas" width="140" height="38"></canvas><button type="button" class="ref-btn" id="ref-btn"><i class="fas fa-sync-alt"></i></button></div><input type="text" id="cap-in" class="cap-input" placeholder="کد را وارد کنید" maxlength="5" required></div></div><button type="submit" id="t-btn" class="btn" disabled>تایید و بازیابی رمز عبور</button><div id="msg"></div></form><div class="footer"><p><a href="index.html" id="t-back"><i class="fas fa-arrow-right"></i> بازگشت به ورود</a></p></div></div><script>const langData={fa:{dir:'rtl',wel:'بازیابی رمز عبور حساب کاربری',user:'نام کاربری یا ایمیل',userP:'ایمیل یا نام کاربری',otp:'کد ۶ رقمی ایمیل',cap:'کد امنیتی',capP:'کد را وارد کنید',btn:'تایید و بازیابی رمز عبور',back:'بازگشت به ورود',errCap:'کد امنیتی اشتباه است!',succ:'تایید شد! در حال انتقال...'},en:{dir:'ltr',wel:'Reset Account Password',user:'Username or Email',userP:'Email or Username',otp:'6-Digit Email Code',cap:'Security Code',capP:'Enter code',btn:'Confirm & Reset Password',back:'Back to Login',errCap:'Invalid security code!',succ:'Verified! Redirecting...'},ar:{dir:'rtl',wel:'استعادة كلمة المرور',user:'اسم المستخدم أو البريد',userP:'البريد أو اسم المستخدم',otp:'رمز البريد 6 أرقام',cap:'رمز التحقق',capP:'أدخل الرمز',btn:'تأكيد واستعادة كلمة المرور',back:'العودة لتسجيل الدخول',errCap:'رمز التحقق غير صحيح!',succ:'تم التحقق! جاري التوجيه...'},tr:{dir:'ltr',wel:'Şifre Sıfırlama',user:'Kullanıcı Adı veya E-posta',userP:'E-posta veya Kullanıcı Adı',otp:'6 Haneli E-posta Kodu',cap:'Güvenlik Kodu',capP:'Kodu girin',btn:'Onayla ve Şifreyi Sıfırla',back:'Giriş Sayfasına Dön',errCap:'Geçersiz güvenlik kodu!',succ:'Doğrulandı! Yönlendiriliyorsunuz...'},ru:{dir:'ltr',wel:'Сброс пароля',user:'Имя пользователя или Email',userP:'Email или имя пользователя',otp:'6-значный код из Email',cap:'Защитный код',capP:'Введите код',btn:'Подтвердить и сбросить пароль',back:'Назад ко входу',errCap:'Неверный защитный код!',succ:'Подтверждено! Перенаправление...'},es:{dir:'ltr',wel:'Restablecer contraseña',user:'Usuario o correo electrónico',userP:'Correo o usuario',otp:'Código de 6 dígitos del correo',cap:'Código de seguridad',capP:'Ingrese el código',btn:'Confirmar y restablecer',back:'Volver al inicio de sesión',errCap:'¡Código de seguridad inválido!',succ:'¡Verificado! Redirigiendo...'},fr:{dir:'ltr',wel:'Réinitialiser le mot de passe',user:'Nom d\'utilisateur ou E-mail',userP:'E-mail ou nom d\'utilisateur',otp:'Code e-mail à 6 chiffres',cap:'Code de sécurité',capP:'Entrez le code',btn:'Confirmer et réinitialiser',back:'Retour à la connexion',errCap:'Code de sécurité invalide !',succ:'Vérifié ! Redirection...'},de:{dir:'ltr',wel:'Passwort zurücksetzen',user:'Benutzername oder E-Mail',userP:'E-Mail oder Benutzername',otp:'6-stelliger E-Mail-Code',cap:'Sicherheitscode',capP:'Code eingeben',btn:'Bestätigen & Zurücksetzen',back:'Zurück zur Anmeldung',errCap:'Ungültiger Sicherheitscode!',succ:'Bestätigt! Weiterleitung...'}};let currentLang=localStorage.getItem('zenix_lang')||'fa',code='';const langBtn=document.getElementById('lang-btn'),langMenu=document.getElementById('lang-menu'),cv=document.getElementById('c-canvas'),capIn=document.getElementById('cap-in'),otpIn=document.getElementById('otp-in'),userIn=document.getElementById('user'),submitBtn=document.getElementById('t-btn'),msg=document.getElementById('msg'),form=document.getElementById('form');langBtn.onclick=e=>{e.stopPropagation();langMenu.classList.toggle('show')};document.onclick=()=>langMenu.classList.remove('show');function setLang(l){currentLang=l;localStorage.setItem('zenix_lang',l);const t=langData[l];document.documentElement.setAttribute('dir',t.dir);document.documentElement.setAttribute('lang',l);document.getElementById('t-wel').textContent=t.wel;document.getElementById('l-user').innerHTML=`<i class="fas fa-user"></i> ${t.user} <span class="req">*</span>`;userIn.placeholder=t.userP;document.getElementById('l-otp').innerHTML=`<i class="fas fa-paper-plane"></i> ${t.otp} <span class="req">*</span>`;document.getElementById('l-cap').innerHTML=`<i class="fas fa-shield-alt"></i> ${t.cap} <span class="req">*</span>`;capIn.placeholder=t.capP;submitBtn.textContent=t.btn;const arrowIcon=t.dir==='rtl'?'fa-arrow-right':'fa-arrow-left';document.getElementById('t-back').innerHTML=`<i class="fas ${arrowIcon}"></i> ${t.back}`}document.querySelectorAll('.lang-item').forEach(i=>i.onclick=()=>setLang(i.dataset.lang));function checkInputs(){submitBtn.disabled=!(userIn.value.trim()&&otpIn.value.length===6&&capIn.value.length===5)}[userIn,otpIn,capIn].forEach(i=>i.addEventListener('input',checkInputs));function drawCap(){if(!cv)return;const ctx=cv.getContext('2d');code='';const chars='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';for(let i=0;i<5;i++)code+=chars.charAt(Math.floor(Math.random()*chars.length));ctx.fillStyle='#0b1120';ctx.fillRect(0,0,cv.width,cv.height);ctx.font='bold 18px Arial';ctx.fillStyle='#38bdf8';ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<5;i++)ctx.fillText(code[i],20+(i*25),cv.height/2)}document.getElementById('ref-btn').onclick=()=>{capIn.value='';drawCap();checkInputs()};cv.onclick=()=>{drawCap();checkInputs()};form.onsubmit=e=>{e.preventDefault();const t=langData[currentLang];if(capIn.value.toUpperCase()!==code){msg.textContent=t.errCap;msg.className='err';capIn.value='';drawCap();checkInputs();return}msg.textContent=t.succ;msg.className='succ';setTimeout(()=>window.location.href='reset-password.html',1500)};setLang(currentLang);drawCap();</script></body></html>
