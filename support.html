<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند هوش مصنوعی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .back-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:540px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:36px;height:36px;background:rgba(56,189,248,.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px}
        .chat-title h3{font-size:14px;color:#f8fafc}
        .chat-title p{font-size:10px;color:#22c55e;display:flex;align-items:center;gap:4px}
        .chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.7}
        .msg.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .options-container{display:flex;flex-direction:column;gap:8px;margin-top:10px}
        .opt-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:9px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-align:right;transition:all .3s ease;display:flex;align-items:center;gap:8px}
        .opt-btn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8}
        .chat-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
    </style>
</head>
<body>
    <header>
        <div class="logo"><h2>ZENIX AI SUPPORT</h2></div>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-right"></i> بازگشت به داشبورد</a>
    </header>
    <div class="c">
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar"><i class="fas fa-brain"></i></div>
                <div class="chat-title">
                    <h3>هوش مصنوعی زنیکس</h3>
                    <p><i class="fas fa-circle" style="font-size:6px;"></i> پاسخگوی هوشمند پلتفرم</p>
                </div>
            </div>
            <div class="chat-body" id="chat-body">
                <div class="msg bot">
                    درود! من دستیار هوشمند پلتفرم **Zenix** هستم. هر سوالی درباره واریز، برداشت، نحوه کارکرد ربات کوانتیفیکیشن یا حساب خود دارید بپرسید تا راهنمایی‌تان کنم.<br>امروز چطور می‌توانم کمکتان کنم؟
                    <div class="options-container">
                        <button class="opt-btn" onclick="sendQuickQuery('مراحل واریز وجه و شارژ حساب چطور است؟')"><i class="fas fa-wallet"></i> واریز وجه و شارژ حساب</button>
                        <button class="opt-btn" onclick="sendQuickQuery('چگونه سود کوانتیفیکیشن فعال می‌شود؟')"><i class="fas fa-robot"></i> نحوه کارکرد کوانتیفیکیشن</button>
                        <button class="opt-btn" onclick="sendQuickQuery('قوانین و نحوه برداشت دارایی چیست؟')"><i class="fas fa-arrow-down-left-and-arrow-up-right-to-center"></i> برداشت دارایی</button>
                    </div>
                </div>
            </div>
            <div class="chat-footer">
                <input type="text" class="chat-input" id="user-input" placeholder="سوال خود را درباره پلتفرم بنویسید...">
                <button class="send-btn" id="send-msg-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 Zenix. All rights reserved.</p></footer>

    <script>
        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-msg-btn');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // نمایش انیمیشن در حال تایپ هوش مصنوعی
        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'msg bot typing-msg';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function processAIResponse(question) {
            const typingElem = showTypingIndicator();
            
            setTimeout(() => {
                typingElem.remove();
                let reply = "";
                const q = question.toLowerCase();

                // پایگاه دانش هوش مصنوعی اختصاصی پلتفرم
                if (q.includes('واریز') || q.includes('شارژ') || q.includes('Deposit')) {
                    reply = `برای واریز وجه به حساب Zenix:<br>۱. به بخش <strong>واریز</strong> در داشبورد بروید.<br>۲. آدرس کیف پول یا شبکه مد نظر را کپی کنید.<br>۳. پس از انتقال رمزارز، هش تراکنش (TxID) را ثبت نمایید. واریزها معمولاً طی ۵ الی ۱۵ دقیقه تایید می‌شوند.<br><br>آیا این پاسخ برایتان کافی بود یا نیاز به اتصال به مدیر دارید؟
                    <div class="options-container">
                        <button class="opt-btn" onclick="addMessage('بله، ممنون از راهنمایی شما.','user');setTimeout(()=>addMessage('خواهش می‌کنم! خوشحالم که توانستم کمکتان کنم.','bot'),500)"><i class="fas fa-check"></i> بله، مشکل حل شد</button>
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> خیر، اتصال به پشتیبان انسانی (مدیر)</button>
                    </div>`;
                } 
                else if (q.includes('برداشت') || q.includes('نقد') || q.includes('Withdraw')) {
                    reply = `درباره بخش <strong>برداشت</strong>:<br>برداشت دارایی از طریق منوی برداشت انجام می‌شود. حداقل مبلغ برداشت مشخص بوده و درخواست‌ها جهت تامین امنیت حداکثری، در سیکل‌های روزانه بررسی و به کیف پول مقصد واریز می‌گردند.<br><br>اگر در دریافت برداشت خود تاخیری مشاهده کردید، می‌توانید با مدیر ارتباط بگیرید:
                    <div class="options-container">
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> اتصال به پشتیبان انسانی (مدیر)</button>
                    </div>`;
                } 
                else if (q.includes('کوانتیفیکیشن') || q.includes('ربات') || q.includes('سود') || q.includes('Quantification')) {
                    reply = `سیستم <strong>کوانتیفیکیشن (Quantification)</strong> قلب تپنده پلتفرم Zenix است:<br>این بخش با استفاده از الگوریتم‌های هوش مصنوعی، نوسانات بازار رمزارزها را آنالیز کرده و به صورت خودکار فرآیندهای معاملاتی را انجام می‌دهد تا سود روزانه به موجودی حساب شما افزوده شود.<br><br>سوالی درباره نحوه استارت زدن ربات دارید؟
                    <div class="options-container">
                        <button class="opt-btn" onclick="addMessage('متوجه شدم، ممنون.','user');setTimeout(()=>addMessage('عالیه! موفق باشید.','bot'),500)"><i class="fas fa-check"></i> متوجه شدم</button>
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> اتصال به پشتیبان انسانی (مدیر)</button>
                    </div>`;
                } 
                else if (q.includes('تیم') || q.includes('زیرمجموعه') || q.includes('رفرال') || q.includes('دستمزد')) {
                    reply = `سیستم <strong>تیم و زیرمجموعه‌ها</strong>:<br>شما می‌توانید از طریق لینک معرفی خود در بخش تیم، دوستانتان را دعوت کنید و از تراکنش‌ها و فعالیت‌های آن‌ها در چند سطح مختلف پاداش و کمیسیون دائمی دریافت کنید.`;
                } 
                else {
                    // پاسخ هوشمند برای سوالات متفرقه یا خارج از چارچوب پلتفرم
                    reply = `من به عنوان دستیار هوشمند <strong>Zenix</strong>، فقط مجاز به پاسخگویی به سوالات مرتبط با این پلتفرم مالی (واریز، برداشت، کوانتیفیکیشن و حساب کاربری) هستم.<br>اگر سوال یا مشکل خاصی در این زمینه‌ها دارید که من نتوانستم پاسخ دهم، لطفاً مستقیماً با مدیر گفتگو کنید:
                    <div class="options-container">
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> اتصال به پشتیبان انسانی (مدیر)</button>
                    </div>`;
                }

                addMessage(reply, 'bot');
            }, 1000);
        }

        function sendQuickQuery(text) {
            addMessage(text, 'user');
            processAIResponse(text);
        }

        function connectToAdmin() {
            addMessage('درخواست اتصال به پشتیبان انسانی...', 'user');
            setTimeout(() => {
                addMessage(`در حال انتقال به اپراتور...<br>لطفاً روی دکمه زیر کلیک کنید تا مستقیماً با مدیریت گفتگو کنید:
                <div class="options-container">
                    <a href="https://t.me/your_admin_username" target="_blank" class="opt-btn" style="background:#22c55e22;border-color:#22c55e;color:#22c55e;text-decoration:none;justify-content:center;"><i class="fab fa-telegram"></i> ورود به چت مستقیم مدیر (تلگرام)</a>
                </div>`, 'bot');
            }, 800);
        }

        sendBtn.onclick = () => {
            const val = userInput.value.trim();
            if(!val) return;
            addMessage(val, 'user');
            userInput.value = '';
            processAIResponse(val);
        };

        userInput.onkeypress = (e) => {
            if(e.key === 'Enter') sendBtn.click();
        };
    </script>
</body>
</html>
